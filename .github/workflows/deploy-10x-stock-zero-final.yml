name: Deploy 10X STOCK ZERO - FINAL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Prepare current app files
        shell: bash
        run: |
          set -e
          rm -rf zero_build
          mkdir zero_build

          for f in \
            index.html \
            _worker.js \
            tenx_data.json \
            tenx_history.json \
            live_quotes.json \
            manifest.webmanifest \
            sw.js \
            icon-192.png \
            icon-512.png \
            apple-touch-icon.png
          do
            if [ -f "$f" ]; then
              cp "$f" zero_build/
            fi
          done

          test -s zero_build/index.html
          test -s zero_build/_worker.js

      - name: Create Wrangler config
        shell: bash
        run: |
          cat > wrangler-final.toml <<'WRANGLER'
          name = "shiny-cake-fb9f"
          main = "zero_build/_worker.js"
          compatibility_date = "2026-09-04"

          [assets]
          directory = "zero_build"
          binding = "ASSETS"
          WRANGLER

      - name: Deploy current app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          npx --yes wrangler@4 deploy --config wrangler-final.toml
