name: Fix 10X STOCK only

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-10x-stock.yml"

permissions:
  contents: write

jobs:
  fix-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch 10X STOCK index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # iPhone focus zoom fix: custom inputs/selects must be at least 16px.
          s = re.sub(
              r'(\.customgrid input,\.customgrid select\{[^}]*?)font-size:\s*\d+px',
              r'\1font-size:16px',
              s,
              count=1
          )
          if 'font-size:16px!important' not in s:
              s = s.replace(
                  '</style>',
                  '\n.customgrid input,.customgrid select{font-size:16px!important}\n</style>',
                  1
              )

          START='<!-- TENX_API_FIX_START -->'
          END='<!-- TENX_API_FIX_END -->'
          a=s.find(START); b=s.find(END)
          if a!=-1 and b!=-1 and b>a:
              s=s[:a]+s[b+len(END):]

          block=r'''<!-- TENX_API_FIX_START -->
          <script>
          (()=> {
            async function tenxLookup(){
              const m=document.querySelector('#customMarket')?.value;
              const el=document.querySelector('#customCode');
              const st=document.querySelector('#customLookup');
              if(!m||!el||!st)return null;

              const c=String(el.value||'').trim().toUpperCase().replace(/\.T$/i,'');
              if(!c){
                st.className='lookupstatus';
                st.textContent='コードを入力すると会社名と現在値を確認します。';
                return null;
              }

              el.value=c;
              st.className='lookupstatus';
              st.textContent='会社名・現在値を取得中…';

              try{
                const r=await fetch(
                  '/api/stock?market='+encodeURIComponent(m)+'&code='+encodeURIComponent(c)+'&t='+Date.now(),
                  {cache:'no-store'}
                );
                const q=await r.json();

                if(r.ok&&q&&q.ok&&Number.isFinite(Number(q.price))){
                  const name=q.name||c;
                  document.querySelector('#customName').value=name;
                  document.querySelector('#customNow').value=Number(q.price);
                  document.querySelector('#customName').readOnly=true;
                  document.querySelector('#customNow').readOnly=true;
                  st.className='lookupstatus ok';
                  const prefix=m==='japan'?'¥':'$';
                  st.textContent='✓ '+name+' ｜ 現在値 '+prefix+
                    Number(q.price).toLocaleString(undefined,{
                      minimumFractionDigits:m==='usa'?2:0,
                      maximumFractionDigits:2
                    });
                  return q;
                }
              }catch(e){}

              st.className='lookupstatus warn';
              st.textContent='現在値を取得できませんでした。もう一度コード欄から移動してください。';
              document.querySelector('#customNow').readOnly=false;
              return null;
            }

            window.autofillCustomStock=tenxLookup;

            // Replace the old code input node so the previous 250ms handler is removed.
            const old=document.getElementById('customCode');
            if(old){
              const fresh=old.cloneNode(true);
              fresh.style.fontSize='16px';
              fresh.setAttribute('autocapitalize','characters');
              fresh.setAttribute('autocomplete','off');
              fresh.setAttribute('spellcheck','false');
              old.replaceWith(fresh);

              let composing=false;
              fresh.addEventListener('compositionstart',()=>composing=true);
              fresh.addEventListener('compositionend',()=>composing=false);
              fresh.addEventListener('change',()=>{if(!composing)tenxLookup();});
              fresh.addEventListener('blur',()=>{if(!composing)tenxLookup();});
            }

            document.querySelectorAll('.customgrid input,.customgrid select')
              .forEach(x=>x.style.fontSize='16px');
          })();
          </script>
          <!-- TENX_API_FIX_END -->'''

          if '</body>' not in s:
              raise SystemExit('index.html missing </body>')

          s=s.replace('</body>',block+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit fixed index
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix 10X STOCK live quote lookup and iPhone zoom"
          git push

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Create Wrangler config
        shell: bash
        run: |
          cat > wrangler.toml <<'EOF'
          name = "quiet-firefly-dd73"
          main = "_worker.js"
          compatibility_date = "2026-08-21"

          [assets]
          directory = "."
          binding = "ASSETS"
          EOF

      - name: Deploy 10X STOCK to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        shell: bash
        run: |
          TOKEN="${CLOUDFLARE_API_TOKEN:-${CF_API_TOKEN:-$CLOUDFLARE_TOKEN}}"
          ACCOUNT="${CLOUDFLARE_ACCOUNT_ID:-$CF_ACCOUNT_ID}"
          test -n "$TOKEN" || { echo "::error::Cloudflare token missing"; exit 1; }
          export CLOUDFLARE_API_TOKEN="$TOKEN"
          if [ -n "$ACCOUNT" ]; then export CLOUDFLARE_ACCOUNT_ID="$ACCOUNT"; fi
          npx --yes wrangler@4 deploy
