name: Publish Japan + US Live Quotes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-all-japan-quotes.yml"
  schedule:
    - cron: "*/30 * * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: all-live-quotes
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Build Japan and US live quote cache
        shell: bash
        run: |
          cat > /tmp/build_quotes.py <<'PY'
          import json
          import urllib.request
          from pathlib import Path
          from datetime import datetime, timezone

          HEADERS = {
              "Content-Type": "application/json",
              "Accept": "application/json",
              "User-Agent": "Mozilla/5.0"
          }

          def scan(url, payload):
              req = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode("utf-8"),
                  headers=HEADERS,
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=90) as r:
                  return json.loads(r.read().decode("utf-8"))

          jp_data = scan(
              "https://scanner.tradingview.com/japan/scan",
              {
                  "filter": [{"left": "exchange", "operation": "equal", "right": "TSE"}],
                  "options": {"lang": "ja"},
                  "markets": ["japan"],
                  "symbols": {"query": {"types": []}, "tickers": []},
                  "columns": ["name", "description", "close", "change", "exchange"],
                  "range": [0, 10000],
              },
          )

          japan = {}
          for row in jp_data.get("data") or []:
              d = row.get("d") or []
              if len(d) < 4:
                  continue
              code = str(d[0] or "").strip().upper().replace(".T", "")
              price = d[2]
              if not code or not isinstance(price, (int, float)) or price <= 0:
                  continue
              japan[code] = {
                  "code": code,
                  "name": str(d[1] or code).strip(),
                  "price": float(price),
                  "change_pct": float(d[3] or 0),
                  "source": "TradingView scanner",
              }

          us_data = scan(
              "https://scanner.tradingview.com/america/scan",
              {
                  "filter": [{"left": "type", "operation": "equal", "right": "stock"}],
                  "options": {"lang": "en"},
                  "markets": ["america"],
                  "symbols": {"query": {"types": []}, "tickers": []},
                  "columns": ["name", "description", "close", "change", "exchange"],
                  "range": [0, 20000],
              },
          )

          usa = {}
          allowed = {"NASDAQ", "NYSE", "AMEX", "NYSEARCA"}
          for row in us_data.get("data") or []:
              d = row.get("d") or []
              if len(d) < 5:
                  continue
              code = str(d[0] or "").strip().upper()
              price = d[2]
              exchange = str(d[4] or "").strip().upper()
              if exchange not in allowed:
                  continue
              if not code or not isinstance(price, (int, float)) or price <= 0:
                  continue
              usa[code] = {
                  "code": code,
                  "name": str(d[1] or code).strip(),
                  "price": float(price),
                  "change_pct": float(d[3] or 0),
                  "exchange": exchange,
                  "source": "TradingView scanner",
              }

          if "7203" not in japan:
              raise SystemExit("Safety check failed: Japan 7203 missing")
          if "NVDA" not in usa:
              raise SystemExit("Safety check failed: US NVDA missing")

          out = {
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "source": "TradingView full-market scan via GitHub Actions",
              "japan": japan,
              "usa": usa,
          }
          Path("live_quotes.json").write_text(
              json.dumps(out, ensure_ascii=False, separators=(",", ":")),
              encoding="utf-8",
          )

          print("Japan quotes:", len(japan))
          print("US quotes:", len(usa))
          print("7203:", japan["7203"])
          print("NVDA:", usa["NVDA"])
          PY

          python /tmp/build_quotes.py

      - name: Patch published index safely
        shell: bash
        run: |
          cat > /tmp/patch_index.py <<'PY'
          from pathlib import Path

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          START = "<!-- LIVE_QUOTES_V2_START -->"
          END = "<!-- LIVE_QUOTES_V2_END -->"

          a = s.find(START)
          b = s.find(END)
          if a != -1 and b != -1 and b > a:
              s = s[:a] + s[b + len(END):]

          block = r'''<!-- LIVE_QUOTES_V2_START -->
          <script>
          (() => {
            const originalQuoteInfo = quoteInfo;
            let liveQuotes = {japan:{}, usa:{}};

            const liveReady = fetch("live_quotes.json?t=" + Date.now(), {cache:"no-store"})
              .then(r => {
                if (!r.ok) throw new Error("live_quotes.json HTTP " + r.status);
                return r.json();
              })
              .then(x => {
                liveQuotes = x || {japan:{}, usa:{}};
              })
              .catch(e => console.warn("live quote cache:", e));

            quoteInfo = function(m, c) {
              const k = String(c || "").trim().toUpperCase().replace(/\.T$/i, "");
              const q = liveQuotes && liveQuotes[m] && liveQuotes[m][k];
              return q || originalQuoteInfo(m, k);
            };

            autofillCustomStock = async function() {
              const m = $("#customMarket").value;
              const el = $("#customCode");
              const c = String(el.value || "").trim().toUpperCase().replace(/\.T$/i, "");
              const st = $("#customLookup");

              if (!c) {
                st.className = "lookupstatus";
                st.textContent = "コードを入力すると会社名と現在値を確認します。";
                return null;
              }

              el.value = c;

              $("#customName").readOnly = false;
              $("#customNow").readOnly = false;
              st.className = "lookupstatus";
              st.textContent = "会社名・現在値を取得中…";

              await liveReady;

              let q = quoteInfo(m, c);
              let mappedName = "";
              try {
                const map = await loadCompanyMap(m);
                mappedName = String((map && map[c]) || "").trim();
              } catch (e) {}

              if (q && Number.isFinite(Number(q.price))) {
                const displayName = mappedName || q.name || c;
                $("#customName").value = displayName;
                $("#customNow").value = Number(q.price);
                $("#customName").readOnly = true;
                $("#customNow").readOnly = true;
                st.className = "lookupstatus ok";
                st.textContent =
                  "✓ " + displayName +
                  " ｜ 現在値 " + money(q.price, m) +
                  " ｜ " + (Number(q.change_pct || 0) >= 0 ? "+" : "") +
                  Number(q.change_pct || 0).toFixed(2) + "%";
                return q;
              }

              $("#customName").value = mappedName;
              $("#customName").readOnly = !!mappedName;
              $("#customNow").value = "";
              $("#customNow").readOnly = false;
              st.className = "lookupstatus warn";
              st.textContent = mappedName
                ? "✓ " + mappedName + " を確認しました。現在値のみ手入力してください。"
                : "銘柄を確認できませんでした。";
              return null;
            };

            const oldInput = document.getElementById("customCode");
            if (oldInput) {
              const freshInput = oldInput.cloneNode(true);
              freshInput.setAttribute("autocapitalize", "characters");
              freshInput.setAttribute("autocomplete", "off");
              freshInput.setAttribute("spellcheck", "false");
              oldInput.replaceWith(freshInput);

              let composing = false;

              freshInput.addEventListener("compositionstart", () => {
                composing = true;
              });

              freshInput.addEventListener("compositionend", () => {
                composing = false;
                const st = $("#customLookup");
                st.className = "lookupstatus";
                st.textContent = "入力後に「完了」を押すか、別の欄をタップしてください。";
              });

              freshInput.addEventListener("input", (e) => {
                if (composing || e.isComposing) return;
                const st = $("#customLookup");
                st.className = "lookupstatus";
                st.textContent = "入力後に「完了」を押すか、別の欄をタップしてください。";
              });

              freshInput.addEventListener("change", () => {
                if (!composing) autofillCustomStock();
              });

              freshInput.addEventListener("blur", () => {
                if (!composing) autofillCustomStock();
              });
            }
          })();
          </script>
          <!-- LIVE_QUOTES_V2_END -->'''

          if "</body>" not in s:
              raise SystemExit("index.html does not contain </body>")

          s = s.replace("</body>", block + "\n</body>", 1)
          p.write_text(s, encoding="utf-8")
          PY

          python /tmp/patch_index.py

      - name: Verify generated files
        shell: bash
        run: |
          test -s live_quotes.json
          grep -q '"7203"' live_quotes.json
          grep -q '"NVDA"' live_quotes.json
          grep -q 'LIVE_QUOTES_V2_START' index.html
          grep -q 'compositionstart' index.html
          echo "Japan/US quote cache and IME-safe input patch verified."

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
