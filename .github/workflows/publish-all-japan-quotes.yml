name: Fix Live Quotes and Deploy Cloudflare

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-all-japan-quotes.yml"
  schedule:
    - cron: "*/30 * * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build live quote cache
        shell: bash
        run: |
          cat > /tmp/build_quotes.py <<'PY'
          import json
          import urllib.request
          from pathlib import Path
          from datetime import datetime, timezone

          HEADERS = {
              "Content-Type": "application/json",
              "Accept": "application/json",
              "User-Agent": "Mozilla/5.0"
          }

          def scan(url, payload):
              req = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode("utf-8"),
                  headers=HEADERS,
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=90) as r:
                  return json.loads(r.read().decode("utf-8"))

          jp_data = scan(
              "https://scanner.tradingview.com/japan/scan",
              {
                  "filter": [{"left": "exchange", "operation": "equal", "right": "TSE"}],
                  "options": {"lang": "ja"},
                  "markets": ["japan"],
                  "symbols": {"query": {"types": []}, "tickers": []},
                  "columns": ["name", "description", "close", "change", "exchange"],
                  "range": [0, 10000],
              }
          )

          us_data = scan(
              "https://scanner.tradingview.com/america/scan",
              {
                  "filter": [{"left": "type", "operation": "equal", "right": "stock"}],
                  "options": {"lang": "en"},
                  "markets": ["america"],
                  "symbols": {"query": {"types": []}, "tickers": []},
                  "columns": ["name", "description", "close", "change", "exchange"],
                  "range": [0, 20000],
              }
          )

          def build(data, allowed_exchanges=None):
              out = {}
              for row in data.get("data") or []:
                  d = row.get("d") or []
                  if len(d) < 4:
                      continue
                  code = str(d[0] or "").strip().upper().replace(".T", "")
                  name = str(d[1] or code).strip()
                  price = d[2]
                  change = d[3]
                  exchange = str(d[4] if len(d) > 4 else "").strip().upper()

                  if allowed_exchanges and exchange not in allowed_exchanges:
                      continue
                  if not code or not isinstance(price, (int, float)) or price <= 0:
                      continue

                  out[code] = {
                      "code": code,
                      "name": name,
                      "price": float(price),
                      "change_pct": float(change or 0),
                      "exchange": exchange
                  }
              return out

          japan = build(jp_data)
          usa = build(us_data, {"NASDAQ", "NYSE", "AMEX", "NYSEARCA"})

          if "7203" not in japan:
              raise SystemExit("Safety check failed: 7203 missing")
          if "NVDA" not in usa:
              raise SystemExit("Safety check failed: NVDA missing")

          Path("live_quotes.json").write_text(
              json.dumps({
                  "updated_at": datetime.now(timezone.utc).isoformat(),
                  "japan": japan,
                  "usa": usa
              }, ensure_ascii=False, separators=(",", ":")),
              encoding="utf-8"
          )

          print("Japan quotes:", len(japan))
          print("US quotes:", len(usa))
          print("NVDA:", usa["NVDA"])
          PY

          python /tmp/build_quotes.py

      - name: Patch index.html for iPhone and live prices
        shell: bash
        run: |
          cat > /tmp/patch_index.py <<'PY'
          from pathlib import Path
          import re

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          # Prevent iPhone Safari from auto-zooming focused form controls.
          s = re.sub(
              r'(\.customgrid input,\.customgrid select\{[^}]*?)font-size:\s*12px',
              r'\1font-size:16px',
              s,
              count=1
          )

          # Remove older injected live-quote blocks so only one version remains.
          markers = [
              ("<!-- ALL_JAPAN_QUOTES_START -->", "<!-- ALL_JAPAN_QUOTES_END -->"),
              ("<!-- LIVE_QUOTES_V2_START -->", "<!-- LIVE_QUOTES_V2_END -->"),
              ("<!-- STABLE_LIVE_QUOTES_START -->", "<!-- STABLE_LIVE_QUOTES_END -->"),
              ("<!-- FINAL_LIVE_QUOTES_START -->", "<!-- FINAL_LIVE_QUOTES_END -->"),
          ]
          for start, end in markers:
              while True:
                  a = s.find(start)
                  b = s.find(end)
                  if a == -1 or b == -1 or b <= a:
                      break
                  s = s[:a] + s[b + len(end):]

          block = r'''<!-- FINAL_LIVE_QUOTES_START -->
          <script>
          (() => {
            const baseQuoteInfo = quoteInfo;
            let liveQuotes = {japan:{}, usa:{}};

            const liveReady = fetch("./live_quotes.json?t=" + Date.now(), {cache:"no-store"})
              .then(r => {
                if (!r.ok) throw new Error("live_quotes.json HTTP " + r.status);
                return r.json();
              })
              .then(x => {
                liveQuotes = x || {japan:{}, usa:{}};
              })
              .catch(e => console.warn("live quote cache failed:", e));

            quoteInfo = function(m, c) {
              const key = String(c || "").trim().toUpperCase().replace(/\.T$/i, "");
              const q = liveQuotes?.[m]?.[key];
              if (q && Number.isFinite(Number(q.price))) return q;
              return baseQuoteInfo(m, key);
            };

            autofillCustomStock = async function() {
              const m = $("#customMarket").value;
              const el = $("#customCode");
              const c = String(el.value || "").trim().toUpperCase().replace(/\.T$/i, "");
              const st = $("#customLookup");

              if (!c) {
                st.className = "lookupstatus";
                st.textContent = "コードを入力すると会社名と現在値を確認します。";
                return null;
              }

              el.value = c;
              st.className = "lookupstatus";
              st.textContent = "会社名・現在値を取得中…";

              await liveReady;

              const q = quoteInfo(m, c);
              let mappedName = "";
              try {
                const map = await loadCompanyMap(m);
                mappedName = String((map && map[c]) || "").trim();
              } catch (e) {}

              if (q && Number.isFinite(Number(q.price))) {
                const name = mappedName || q.name || c;
                $("#customName").value = name;
                $("#customNow").value = Number(q.price);
                $("#customName").readOnly = true;
                $("#customNow").readOnly = true;
                st.className = "lookupstatus ok";
                st.textContent =
                  "✓ " + name +
                  " ｜ 現在値 " + money(q.price, m) +
                  " ｜ " + (Number(q.change_pct || 0) >= 0 ? "+" : "") +
                  Number(q.change_pct || 0).toFixed(2) + "%";
                return q;
              }

              $("#customName").value = mappedName;
              $("#customName").readOnly = !!mappedName;
              $("#customNow").value = "";
              $("#customNow").readOnly = false;
              st.className = "lookupstatus warn";
              st.textContent = mappedName
                ? "✓ " + mappedName + " を確認しました。現在値のみ手入力してください。"
                : "銘柄を確認できませんでした。";
              return null;
            };

            // Replace ticker input node to remove the old 250ms input listener.
            const oldInput = document.getElementById("customCode");
            if (oldInput) {
              const fresh = oldInput.cloneNode(true);
              fresh.setAttribute("autocapitalize", "characters");
              fresh.setAttribute("autocomplete", "off");
              fresh.setAttribute("spellcheck", "false");
              fresh.style.fontSize = "16px";
              oldInput.replaceWith(fresh);

              let composing = false;

              fresh.addEventListener("compositionstart", () => composing = true);
              fresh.addEventListener("compositionend", () => {
                composing = false;
                $("#customLookup").className = "lookupstatus";
                $("#customLookup").textContent =
                  "入力後に「完了」を押すか、別の欄をタップしてください。";
              });
              fresh.addEventListener("input", e => {
                if (composing || e.isComposing) return;
                $("#customLookup").className = "lookupstatus";
                $("#customLookup").textContent =
                  "入力後に「完了」を押すか、別の欄をタップしてください。";
              });
              fresh.addEventListener("change", () => {
                if (!composing) autofillCustomStock();
              });
              fresh.addEventListener("blur", () => {
                if (!composing) autofillCustomStock();
              });
            }

            // 16px or larger prevents iPhone Safari focus zoom.
            document.querySelectorAll(".customgrid input,.customgrid select").forEach(el => {
              el.style.fontSize = "16px";
            });
          })();
          </script>
          <!-- FINAL_LIVE_QUOTES_END -->'''

          if "</body>" not in s:
              raise SystemExit("index.html missing </body>")

          s = s.replace("</body>", block + "\n</body>", 1)
          p.write_text(s, encoding="utf-8")
          PY

          python /tmp/patch_index.py

      - name: Verify generated files
        shell: bash
        run: |
          grep -q '"NVDA"' live_quotes.json
          grep -q 'FINAL_LIVE_QUOTES_START' index.html
          grep -q 'font-size:16px' index.html
          echo "Validation passed."

      - name: Save fixed files to repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html live_quotes.json
          git diff --cached --quiet || git commit -m "Fix iPhone input zoom and live US quotes"
          git push

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Create Wrangler config
        shell: bash
        run: |
          cat > wrangler.toml <<'EOF'
          name = "quiet-firefly-dd73"
          main = "_worker.js"
          compatibility_date = "2026-08-21"

          [assets]
          directory = "."
          binding = "ASSETS"
          EOF

      - name: Deploy updated app to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        shell: bash
        run: |
          TOKEN="${CLOUDFLARE_API_TOKEN:-${CF_API_TOKEN:-$CLOUDFLARE_TOKEN}}"
          ACCOUNT="${CLOUDFLARE_ACCOUNT_ID:-$CF_ACCOUNT_ID}"

          if [ -z "$TOKEN" ]; then
            echo "::error::Cloudflare API token not found"
            exit 1
          fi

          export CLOUDFLARE_API_TOKEN="$TOKEN"
          if [ -n "$ACCOUNT" ]; then
            export CLOUDFLARE_ACCOUNT_ID="$ACCOUNT"
          fi

          npx --yes wrangler@4 deploy
