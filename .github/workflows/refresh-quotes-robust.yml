name: Refresh Quotes Robustly and Publish

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-quotes-robust.yml"
  schedule:
    - cron: "*/30 * * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: stock-pages-robust
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Build fresh quote cache
        shell: bash
        run: |
          cat > /tmp/quotes.py <<'PY'
          import json, re, time, math, urllib.request, urllib.parse, urllib.error
          from pathlib import Path
          from datetime import datetime, timezone
          from email.utils import parsedate_to_datetime

          UA = "Mozilla/5.0"
          blocked = set()
          last_request = {}

          def request_json(req, timeout=30):
              host = urllib.parse.urlsplit(req.full_url).netloc
              if host in blocked:
                  raise RuntimeError("provider cooldown after HTTP 429")
              for attempt in range(3):
                  gap = 1.5 - (time.monotonic() - last_request.get(host, 0))
                  if gap > 0:
                      time.sleep(gap)
                  last_request[host] = time.monotonic()
                  try:
                      with urllib.request.urlopen(req, timeout=timeout) as response:
                          return json.loads(response.read().decode("utf-8"))
                  except urllib.error.HTTPError as exc:
                      if exc.code not in (429, 500, 502, 503, 504):
                          raise
                      if attempt == 2:
                          if exc.code == 429:
                              blocked.add(host)
                          raise
                      delay = 15 * (2 ** attempt)
                      retry = exc.headers.get("Retry-After", "")
                      if retry:
                          try:
                              delay = max(delay, float(retry))
                          except ValueError:
                              try:
                                  delay = max(delay, (parsedate_to_datetime(retry) - datetime.now(timezone.utc)).total_seconds())
                              except (ValueError, TypeError):
                                  pass
                      if delay > 60:
                          if exc.code == 429:
                              blocked.add(host)
                          raise RuntimeError("provider requested cooldown longer than this run") from exc
                      print(f"HTTP {exc.code}: waiting {delay:.0f}s before retry", flush=True)
                      time.sleep(delay)
                  except (OSError, ValueError):
                      if attempt == 2:
                          raise
                      time.sleep(5 * (2 ** attempt))

          def get_json(url):
              return request_json(urllib.request.Request(url, headers={"User-Agent": UA, "Accept": "application/json"}))

          def valid(q):
              return isinstance(q, dict) and isinstance(q.get("price"), (int, float)) and not isinstance(q["price"], bool) and math.isfinite(q["price"]) and q["price"] > 0

          def collect_codes(node, codes):
              if isinstance(node, dict):
                  code = str(node.get("code") or "").upper().removesuffix(".T")
                  if re.fullmatch(r"[0-9]{4}|[0-9]{3}[A-Z]", code):
                      codes.add(code)
                  for value in node.values():
                      collect_codes(value, codes)
              elif isinstance(node, list):
                  for value in node:
                      collect_codes(value, codes)

          codes = {"7203"}
          data_path = Path("tenx_data.json")
          if data_path.exists():
              collect_codes(json.loads(data_path.read_text()), codes)
          index = Path("index.html")
          if index.exists():
              codes.update(re.findall(r'["\']code["\']\s*:\s*["\']([0-9]{4}|[0-9]{3}[A-Z])["\']', index.read_text()))

          previous = {}
          cache_path = Path("live_quotes.json")
          if cache_path.exists():
              try:
                  previous = json.loads(cache_path.read_text())
              except (ValueError, OSError):
                  pass
          if not isinstance(previous, dict):
              previous = {}
          # The deployment from the previous run can be newer than the repository cache.
          try:
              published = get_json("https://shu39a-lang.github.io/10x-stock-project/live_quotes.json")
              if isinstance(published, dict) and str(published.get("updated_at") or "") > str(previous.get("updated_at") or ""):
                  previous = dict(previous, **published)
          except Exception as exc:
              print("Previous deployment unavailable:", exc, flush=True)

          quotes = {}
          for code, quote in (previous.get("japan") or {}).items():
              if valid(quote):
                  quotes[code] = dict(quote, stale=True, fetched_at=quote.get("fetched_at") or previous.get("updated_at"))
          codes.update(quotes)
          diagnostics = {}
          now = datetime.now(timezone.utc).isoformat()
          fresh = set()

          def store_quote(code, q):
              if valid(q):
                  q.update(fetched_at=now, stale=False)
                  quotes[code] = q
                  fresh.add(code)

          # One request for up to 100 symbols replaces one request for every symbol.
          ordered = sorted(codes)
          for offset in range(0, len(ordered), 100):
              batch = ordered[offset:offset + 100]
              payload = {"symbols": {"tickers": [f"TSE:{c}" for c in batch], "query": {"types": []}}, "columns": ["name", "description", "close", "change"]}
              req = urllib.request.Request("https://scanner.tradingview.com/japan/scan", data=json.dumps(payload).encode(), headers={"User-Agent": UA, "Accept": "application/json", "Content-Type": "application/json"}, method="POST")
              try:
                  result = request_json(req)
                  for row in result.get("data") or []:
                      d = row.get("d") or []
                      if len(d) >= 4 and str(d[0]) in batch:
                          store_quote(str(d[0]), {"code": str(d[0]), "name": str(d[1] or d[0]), "price": d[2], "change_pct": d[3] or 0, "source": "TradingView scanner"})
              except Exception as exc:
                  diagnostics[f"batch_{offset}"] = str(exc)
                  print("Batch fetch failed:", exc, flush=True)
                  if "scanner.tradingview.com" in blocked:
                      break

          for code in ordered:
              if code in fresh:
                  continue
              if "query1.finance.yahoo.com" in blocked:
                  break
              try:
                  result = get_json("https://query1.finance.yahoo.com/v8/finance/chart/" + urllib.parse.quote(code + ".T") + "?interval=1d&range=5d&includePrePost=false")
                  rows = result.get("chart", {}).get("result") or []
                  if not rows:
                      raise ValueError("No quote returned")
                  meta = rows[0].get("meta") or {}
                  price = meta.get("regularMarketPrice")
                  if price is None:
                      closes = (((rows[0].get("indicators") or {}).get("quote") or [{}])[0].get("close") or [])
                      closes = [v for v in closes if isinstance(v, (int, float)) and math.isfinite(v) and v > 0]
                      price = closes[-1] if closes else None
                  prev = meta.get("previousClose") or meta.get("chartPreviousClose")
                  old_name = (quotes.get(code) or {}).get("name")
                  store_quote(code, {"code": code, "name": old_name or meta.get("shortName") or code, "price": price, "change_pct": (price / prev - 1) * 100 if price and prev else 0, "source": "Yahoo chart", "market_time": meta.get("regularMarketTime")})
              except Exception as exc:
                  diagnostics[code] = str(exc)

          if not quotes:
              raise SystemExit("No usable prices and no previous cache; refusing to publish empty data")
          output = dict(previous)
          output.update(japan=quotes, diagnostics=diagnostics, last_attempt_at=now, fresh_count=len(fresh), stale_count=len(quotes) - len(fresh))
          if fresh:
              output["updated_at"] = now
          if len(fresh) < len(codes):
              print(f"::warning::Fresh quotes: {len(fresh)}; previous prices retained: {len(quotes) - len(fresh)}; unavailable: {len(codes - set(quotes))}")
          cache_path.write_text(json.dumps(output, ensure_ascii=False, indent=2, allow_nan=False), encoding="utf-8")
          print("fresh quotes:", len(fresh), "cached quotes:", len(quotes), flush=True)
          PY

          python /tmp/quotes.py

      - name: Inject same-origin quote lookup
        shell: bash
        run: |
          cat > /tmp/patch.py <<'PY'
          from pathlib import Path

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          start = "<!-- ROBUST_QUOTE_FIX_START -->"
          end = "<!-- ROBUST_QUOTE_FIX_END -->"
          a = s.find(start)
          b = s.find(end)
          if a != -1 and b != -1 and b > a:
              s = s[:a] + s[b + len(end):]

          block = """<!-- ROBUST_QUOTE_FIX_START -->
          <script>
          (() => {
            const oldQuoteInfo = quoteInfo;
            let live = {japan:{}};
            const ready = fetch("live_quotes.json?t="+Date.now(), {cache:"no-store"})
              .then(r => { if(!r.ok) throw new Error("live_quotes "+r.status); return r.json(); })
              .then(x => live=x)
              .catch(e => console.warn(e));

            quoteInfo = function(m,c){
              const k=String(c||"").trim().toUpperCase().replace(/\\.T$/i,"");
              const q=live && live[m] && live[m][k];
              return q || oldQuoteInfo(m,k);
            };

            autofillCustomStock = async function(){
              const m=$("#customMarket").value;
              const c=normalizeCustomCode();
              const st=$("#customLookup");

              if(!c){
                st.className="lookupstatus";
                st.textContent="コードを入力すると会社名と現在値を確認します。";
                return null;
              }

              st.className="lookupstatus";
              st.textContent="会社名・現在値を取得中…";
              await ready;

              let q=quoteInfo(m,c);
              let mapped="";
              try{
                const map=await loadCompanyMap(m);
                mapped=String((map&&map[c])||"").trim();
              }catch(e){}

              if(q && Number.isFinite(Number(q.price))){
                const nm=mapped || q.name || c;
                $("#customName").value=nm;
                $("#customNow").value=Number(q.price);
                $("#customName").readOnly=true;
                $("#customNow").readOnly=true;
                st.className="lookupstatus ok";
                st.textContent="✓ "+nm+" ｜ 現在値 "+money(q.price,m)
                  +" ｜ "+(Number(q.change_pct||0)>=0?"+":"")
                  +Number(q.change_pct||0).toFixed(2)+"%";
                if(q.stale){
                  st.className="lookupstatus warn";
                  const dt=q.fetched_at || live.updated_at;
                  const stamp=dt ? new Date(dt) : null;
                  st.textContent="前回値 "+nm+" ｜ "+money(q.price,m)
                    +(stamp && !isNaN(stamp.getTime()) ? " ｜ 取得日時 "+stamp.toLocaleString("ja-JP",{timeZone:"Asia/Tokyo"}) : " ｜ 取得日時不明")
                    +" ｜ 最新価格は更新待ちです。";
                }
                return q;
              }

              $("#customName").value=mapped;
              $("#customName").readOnly=!!mapped;
              $("#customNow").value="";
              $("#customNow").readOnly=false;
              st.className="lookupstatus warn";
              st.textContent=mapped
                ? "✓ "+mapped+" を確認しました。現在値データは更新待ちです。"
                : "自動取得できませんでした。";
              return null;
            };
          })();
          </script>
          <!-- ROBUST_QUOTE_FIX_END -->"""

          if "</body>" not in s:
              raise SystemExit("index.html missing </body>")

          s = s.replace("</body>", block + "\n</body>", 1)
          p.write_text(s, encoding="utf-8")
          PY

          python /tmp/patch.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
