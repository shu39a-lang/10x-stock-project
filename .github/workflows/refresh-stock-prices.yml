name: Refresh Stock Prices and Publish
on:
  push:
    branches: [main]
    paths: [".github/workflows/refresh-stock-prices.yml"]
  schedule:
    - cron: "*/30 * * * 1-5"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: stock-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch prices and patch published page
        shell: bash
        run: |
          cat > /tmp/build.py <<'PY'
          import json,re,urllib.request
          from pathlib import Path
          from datetime import datetime,timezone

          def scan(payload):
              req=urllib.request.Request(
                  "https://scanner.tradingview.com/japan/scan",
                  data=json.dumps(payload).encode(),
                  headers={"Content-Type":"application/json","User-Agent":"Mozilla/5.0"},
                  method="POST")
              with urllib.request.urlopen(req,timeout=25) as r:
                  return json.loads(r.read())

          codes={"7203"}
          for fn in ("index.html","tenx_data.json"):
              p=Path(fn)
              if p.exists():
                  codes.update(re.findall(r"(?<!\\d)(\\d{4})(?!\\d)",p.read_text(encoding="utf-8",errors="ignore")))

          quotes={}
          for code in sorted(codes):
              try:
                  x=scan({"symbols":{"tickers":["TSE:"+code],"query":{"types":[]}},
                          "columns":["name","description","close","change"]})
                  if x.get("data"):
                      d=x["data"][0]["d"]
                      if d[2] is not None:
                          quotes[code]={"code":code,"name":d[1] or d[0] or code,
                                        "price":float(d[2]),"change_pct":float(d[3] or 0)}
              except Exception as e:
                  print("skip",code,e)

          if "7203" not in quotes:
              raise SystemExit("7203 fetch failed; refusing to publish")

          Path("live_quotes.json").write_text(json.dumps({
              "updated_at":datetime.now(timezone.utc).isoformat(),
              "source":"server-side scanner",
              "japan":quotes},ensure_ascii=False,indent=2),encoding="utf-8")

          p=Path("index.html"); s=p.read_text(encoding="utf-8")
          A="<!-- SERVER_QUOTE_FIX_START -->"; B="<!-- SERVER_QUOTE_FIX_END -->"
          a=s.find(A); b=s.find(B)
          if a!=-1 and b!=-1 and b>a: s=s[:a]+s[b+len(B):]
          js="""<!-- SERVER_QUOTE_FIX_START -->
          <script>
          (()=>{const old=quoteInfo;let Q={japan:{}};const ready=fetch("live_quotes.json?t="+Date.now(),{cache:"no-store"}).then(r=>r.json()).then(x=>Q=x).catch(()=>{});
          quoteInfo=(m,c)=>{const k=String(c||"").trim().toUpperCase().replace(/\\.T$/i,"");return (Q[m]&&Q[m][k])||old(m,k)};
          autofillCustomStock=async()=>{const m=$("#customMarket").value,c=normalizeCustomCode(),st=$("#customLookup");if(!c)return null;st.className="lookupstatus";st.textContent="会社名・現在値を取得中…";await ready;let q=quoteInfo(m,c),nm="";try{const map=await loadCompanyMap(m);nm=String((map&&map[c])||"").trim()}catch(e){}
          if(q&&Number.isFinite(Number(q.price))){nm=nm||q.name||c;$("#customName").value=nm;$("#customNow").value=Number(q.price);$("#customName").readOnly=true;$("#customNow").readOnly=true;st.className="lookupstatus ok";st.textContent="✓ "+nm+" ｜ 現在値 "+money(q.price,m)+" ｜ "+(Number(q.change_pct||0)>=0?"+":"")+Number(q.change_pct||0).toFixed(2)+"%";return q}
          $("#customName").value=nm;$("#customName").readOnly=!!nm;$("#customNow").value="";$("#customNow").readOnly=false;st.className="lookupstatus warn";st.textContent=nm?"✓ "+nm+" を確認しました。現在値は次回更新待ちです。":"自動取得できませんでした。";return null};})();
          </script>
          <!-- SERVER_QUOTE_FIX_END -->"""
          if "</body>" not in s: raise SystemExit("index missing body")
          p.write_text(s.replace("</body>",js+"\n</body>",1),encoding="utf-8")
          PY
          python /tmp/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
