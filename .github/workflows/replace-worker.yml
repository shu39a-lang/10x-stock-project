name: Replace Worker

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace _worker.js
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          data = base64.b64decode("")
          Path("_worker.js").write_bytes(data)
          PY
      - name: Commit replacement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _worker.js
          git diff --cached --quiet || git commit -m "Replace worker with completed latest-price version"
          git push
