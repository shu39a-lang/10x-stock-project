name: Rebalance buy timing levels

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebalance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebalance strong buy and buy thresholds
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old in text:
                  return text.replace(old, new, 1)
              if new in text:
                  print(label + " is already updated")
                  return text
              raise SystemExit(label + " was not found")

          path = Path("quick_buy_check.js")
          text = path.read_text(encoding="utf-8")

          old_judge = ''' if(total>=67 && technical>=60){
            text="強い買い";
            cls="strong";
           }else if(total>=58 && technical>=52){'''

          new_judge = ''' if(
            total>=70 &&
            technical>=65 &&
            score>=68 &&
            quality>=60 &&
            financial>=50 &&
            catalyst>=70
           ){
            text="強い買い";
            cls="strong";
           }else if(total>=60 && technical>=55){'''

          text = replace_once(
              text,
              old_judge,
              new_judge,
              "judgment thresholds",
          )

          text = replace_once(
              text,
              ''' if(v>=67)return{''',
              ''' if(v>=70)return{''',
              "strong gauge threshold",
          )
          text = replace_once(
              text,
              ''' if(v>=58)return{''',
              ''' if(v>=60)return{''',
              "buy gauge threshold",
          )
          text = replace_once(
              text,
              ''' if(j.score>=67)''',
              ''' if(j.score>=70)''',
              "strong reason threshold",
          )
          text = replace_once(
              text,
              ''' else if(j.score>=58)''',
              ''' else if(j.score>=60)''',
              "buy reason threshold",
          )
          text = replace_once(
              text,
              ''' if(j.technical>=60)''',
              ''' if(j.technical>=65)''',
              "strong technical reason",
          )
          text = replace_once(
              text,
              ''' else if(j.technical<50)''',
              ''' else if(j.technical<55)''',
              "weak technical reason",
          )

          path.write_text(text, encoding="utf-8")

          index_path = Path("index.html")
          index = index_path.read_text(encoding="utf-8")
          index = replace_once(
              index,
              "quick_buy_check.js?v=4",
              "quick_buy_check.js?v=5",
              "script cache version",
          )
          index_path.write_text(index, encoding="utf-8")

          sw_path = Path("sw.js")
          sw = sw_path.read_text(encoding="utf-8")
          sw = replace_once(
              sw,
              'const CACHE="tenx-stock-v7";',
              'const CACHE="tenx-stock-v8";',
              "service worker cache version",
          )
          sw_path.write_text(sw, encoding="utf-8")

          print("Buy timing levels rebalanced successfully")
          PY

      - name: Validate JavaScript
        run: node --check quick_buy_check.js

      - name: Commit the update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quick_buy_check.js index.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Rebalance strong buy and buy thresholds"
          git push
