                  )[:8]
          
                  theme_w = {
                      "short":0.10,
                      "medium":0.08,
                      "long":0.05
                  }[h]
          
                  heat_w = {
                      "short":0.32,
                      "medium":0.12,
                      "long":0.05
                  }[h]
          
                  candidates = []
          
                  for row in all_rows:
                      code = str(
                          row.get(
