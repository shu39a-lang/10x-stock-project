                          h,
                          heat
                      ):
                          continue
          
                      group = theme_for(
                          code,
                          row.get("name",""),
                          sectors.get(
                              code,
                              "その他"
                          )
                      )
          
                      base = base_horizon_score(
                          row,
                          p,
                          h
                      )
          
                      trend_score = trends.get(
                          group,
                          50
                      )
          
                      total = clamp(
                          (
                              1
                              -theme_w
                              -heat_w
                          )*base
                          +theme_w*trend_score
                          +heat_w*heat,
                          8,
                          92
                      )
          
                      if group in ("銀行", "金融・証券"):
                          finance_penalty = {
                              "short": 6,
                              "medium": 6,
                              "long": 7
                          }[h]
          
                          total = clamp(
                              total - finance_penalty,
                              8,
                              92
                          )
          
                      signal = (
                          "最有力"
                          if total>=80
                          else "有力"
                          if total>=65
                          else "注目"
                          if total>=50
                          else "見送り"
                      )
          
                      catalyst = float(
                          row.get(
                              "catalyst",
                              50
                          )
                      )
          
                      item = {
                          "name":row.get(
                              "name",
                              ""
                          ),
                          "code":code,
                          "price":round(
                              p["price"],
                              2
                          ),
                          "change_pct":round(
                              p["change_pct"],
                              2
                          ),
                          "score":round(
                              total,
                              1
                          ),
                          "signal":signal,
                          "valuation":float(
                              row.get(
                                  "valuation",
                                  50
                              )
                          ),
                          "quality":float(
                              row.get(
                                  "quality",
                                  50
                              )
                          ),
                          "financial":float(
                              row.get(
                                  "financial",
                                  50
                              )
                          ),
                          "technical":technical,
                          "catalyst":catalyst,
                          "trend_theme":group,
                          "trend_score":round(
                              trend_score,
                              1
                          ),
                          "market_heat":round(
                              heat,
                              1
                          ),
                          "_volume_rank":round(
                              volume_rank.get(
                                  code,
                                  50
                              ),
                              1
                          ),
                          "grades":{
                              "valuation":grade(
                                  float(
                                      row.get(
                                          "valuation",
                                          50
                                      )
                                  )
                              ),
                              "quality":grade(
                                  float(
                                      row.get(
