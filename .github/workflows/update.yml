              )
          
              return (
                  p["price"]>p["ma200"]
                  and p["ma50"]>=p["ma200"]*0.95
                  and risk>=35
                  and p["ret200"]>-15
                  and p["drawdown"]>-50
              )
          
          def base_horizon_score(row,p,h):
