                  )
          
                  if (
                      group in ("銀行","金融・証券")
                      and finance_count>=finance_cap
                  ):
                      return False
          
                  if (
                      group=="商社"
                      and counts.get("商社",0)>=trading_cap
                  ):
                      return False
          
                  cap = 4 if relaxed else default_cap
          
                  if (
                      group not in ("銀行","金融・証券","商社")
                      and counts.get(group,0)>=cap
                  ):
                      return False
          
                  return True
          
              def add_item(item):
