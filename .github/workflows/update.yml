                  add_item(item)
          
                  if len(selected)>=20:
                      break
          
              # 20銘柄に届かない場合のみ通常業種枠を1つ緩和
              if len(selected)<20:
                  for item in ranked:
                      if item["code"] in used:
                          continue
          
                      if not can_add(item, relaxed=True):
                          continue
          
                      add_item(item)
          
                      if len(selected)>=20:
                          break
          
