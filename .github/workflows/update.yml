              # その他業種の上限だけ解除して必ず20銘柄まで補充
              if len(selected)<20:
                  for item in ranked:
                      if item["code"] in used:
                          continue
          
                      group = item["_group"]
          
                      finance_count = (
                          counts.get("銀行",0)
                          +counts.get("金融・証券",0)
                      )
          
                      if (
                          group in ("銀行","金融・証券")
                          and finance_count>=finance_cap
                      ):
                          continue
          
                      if (
                          group=="商社"
                          and counts.get("商社",0)>=trading_cap
                      ):
                          continue
          
                      add_item(item)
          
                      if len(selected)>=20:
                          break
          
              # 最終保険：候補数が20以上ある限り必ず20銘柄にする
              if len(selected)<20:
                  for item in ranked:
                      if item["code"] in used:
                          continue
          
                      add_item(item)
          
                      if len(selected)>=20:
                          break
          
