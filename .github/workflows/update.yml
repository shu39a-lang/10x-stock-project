                          trend.main()
                      output=json.loads(p.read_text())
                      self.assertEqual(output['japan']['short'][0]['code'],'6857')
                      self.assertEqual(output['usa'],data['usa'])
          
              def test_true_zero_candidates_are_valid(self):
