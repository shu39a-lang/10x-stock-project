                          x.get("score",0)
                      ),
                      reverse=True
                  )
          
                  for item in volume_ranked:
                      if len(selected)>=volume_slots:
                          break
          
                      if item.get("score",0)<score_floor:
                          continue
          
                      if not can_add(item):
                          continue
          
                      add_item(item)
          
              # 残りは総合スコア + 市場熱量で選ぶ
              for item in ranked:
                  if item["code"] in used:
                      continue
          
                  if not can_add(item):
