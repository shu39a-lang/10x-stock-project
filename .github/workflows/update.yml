                      +0.45*np.clip(p["ret60"],-40,40)
                      +0.20*np.clip(p["ret120"],-60,60)
                      +0.10*(technical-50)
                  )
          
              return (
                  0.20*np.clip(p["ret60"],-40,40)
                  +0.30*np.clip(p["ret120"],-60,60)
                  +0.40*np.clip(p["ret200"],-80,80)
                  +0.10*(technical-50)
              )
          
          def build_group_trends(rows,prices,sectors,h):
              groups = {}
          
              for row in rows:
                  code = str(row.get("code",""))
                  p = prices.get(code)
          
                  if not p:
                      continue
          
                  theme = theme_for(
                      code,
                      row.get("name",""),
                      sectors.get(code,"その他")
                  )
          
                  groups.setdefault(
                      theme,
                      []
                  ).append(
                      raw_trend_value(
                          p,
                          float(row.get("technical",50)),
                          h
                      )
                  )
          
              med = {
                  g:float(np.median(v))
                  for g,v in groups.items()
                  if len(v)>=2
              }
          
              if not med:
                  return {}
          
              vals = np.array(
                  list(med.values()),
                  dtype=float
              )
          
              lo,hi = np.percentile(
                  vals,
                  [10,90]
              )
          
              span = max(
                  hi-lo,
                  1e-6
              )
          
              return {
                  g:round(
                      clamp(
                          25+60*(v-lo)/span,
                          20,
                          88
                      ),
                      1
                  )
                  for g,v in med.items()
              }
          
          def calibrate_horizon_scores(candidates,h):
              if h=="short" or not candidates:
                  return
          
              ranked = sorted(
                  candidates,
                  key=lambda x:x.get("score",0),
                  reverse=True
              )
          
              n = max(len(ranked)-1,1)
              max_bonus = {
                  "medium":4.5,
                  "long":6.5
              }[h]
          
              for i,item in enumerate(ranked):
                  pct = 1.0-(i/n)
          
                  # 上位45%だけを相対補正。トップほど強く、下位はほぼ触らない
                  strength = max(
                      0.0,
                      min(
                          1.0,
                          (pct-0.55)/0.45
                      )
                  )
          
                  adjusted = clamp(
                      item.get("score",0)
                      +max_bonus*strength,
                      8,
                      92
                  )
          
                  item["score"] = round(
                      adjusted,
                      1
                  )
          
                  item["signal"] = (
                      "最有力"
                      if adjusted>=80
                      else "有力"
                      if adjusted>=65
                      else "注目"
                      if adjusted>=50
                      else "見送り"
                  )
          
          def diversified_top20(candidates,strongest_group,h):
              if not candidates:
