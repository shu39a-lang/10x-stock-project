                                          50
                                      )
                                  )
                              ),
                              "financial":grade(
                                  float(
                                      row.get(
                                          "financial",
                                          50
                                      )
                                  )
                              ),
                              "technical":grade(
                                  technical
                              ),
                              "catalyst":grade(
                                  catalyst
                              )
                          },
                          "_group":group
                      }
          
                      candidates.append(
