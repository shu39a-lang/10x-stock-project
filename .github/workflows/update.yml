                      50
                      +np.clip(p["ret60"],-35,35)*0.7
                      +np.clip(p["ret120"],-50,50)*0.35
                  )
          
              return 0.90*base + 0.10*soft_score(
                  50
                  +np.clip(p["ret200"],-60,60)*0.55
              )
          
          def raw_trend_value(p,technical,h):
              if h=="short":
                  return (
                      0.45*np.clip(p["ret20"],-25,25)
                      +0.25*np.clip(p["ret60"],-40,40)
                      +0.20*(technical-50)
