<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>新規買い候補 TOP10</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
.app{max-width:820px;margin:auto;padding:18px 18px 48px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 24px}
.tab{height:70px;border-radius:22px;border:3px solid #333;font-size:28px;font-weight:900}
.jp{background:linear-gradient(135deg,#fff 0 52%,#c90032 52% 100%);color:#111;border-color:#e0bb34}
.us{background:repeating-linear-gradient(0deg,#c7374d 0 10px,#fff 10px 20px);color:#fff;border-color:#445581;text-shadow:0 2px 4px #000}
.tab.active{outline:4px solid #ffd43b;outline-offset:2px}
h1{font-size:36px;line-height:1.15;margin:8px 4px 4px;font-weight:950}
.sub{font-size:18px;color:#a9a9ad;margin:0 4px 20px}
.list{display:grid;gap:18px}
.card{border:2px solid #303033;border-radius:28px;padding:28px 26px 22px;background:#090909}
.top{display:grid;grid-template-columns:84px 1fr auto;gap:22px;align-items:center}
.rank{width:82px;height:82px;border-radius:50%;display:grid;place-items:center;background:#1e1e1f;font-size:36px;font-weight:900}
.name{font-size:34px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.code{font-size:22px;color:#9b9b9f;margin-top:8px;font-weight:700}
.price{text-align:right;font-size:34px;font-weight:950;white-space:nowrap}
.change{text-align:right;font-size:24px;font-weight:900;margin-top:8px;white-space:nowrap}
.up{color:#49d993}.down{color:#ff6b76}
.bottom{margin-left:106px;margin-top:20px;padding-top:16px;border-top:2px solid #232326;display:flex;justify-content:space-between;align-items:center;gap:14px}
.score{font-size:22px;color:#b5b5ba;font-weight:800}
.signal{font-size:20px;color:#ffd43b;font-weight:950;white-space:nowrap}
.note{margin:28px 6px 0;color:#737379;font-size:13px;line-height:1.6;text-align:center}
.error{padding:30px;border:2px solid #333;border-radius:20px;color:#bbb}
@media(max-width:600px){
 .app{padding:14px 14px 34px}
 .tab{height:62px;font-size:22px}
 h1{font-size:29px}.sub{font-size:15px}
 .card{padding:22px 18px 18px;border-radius:22px}
 .top{grid-template-columns:62px 1fr auto;gap:14px}
 .rank{width:62px;height:62px;font-size:28px}
 .name{font-size:27px}.code{font-size:17px}.price{font-size:27px}.change{font-size:20px}
 .bottom{margin-left:76px}.score{font-size:18px}.signal{font-size:18px}
}
</style>
</head>
<body>
<div class="app">
  <div class="tabs">
    <button id="jp" class="tab jp active">🇯🇵 日本株</button>
    <button id="us" class="tab us">⭐ 🇺🇸 米国株</button>
  </div>
  <h1 id="title">日本株 新規買い候補 TOP10</h1>
  <div id="updated" class="sub">更新日 読込中… ｜ 取引終了後の日次更新</div>
  <div id="list" class="list"></div>
  <div class="note">※テクニカル・流動性・トレンド等を総合評価した参考候補です。将来の上昇や利益を保証するものではありません。投資判断はご自身の責任で行ってください。</div>
</div>
<script>
let market="japan";
let data=null;
const money=(v)=> market==="japan"
  ? "¥"+Number(v).toLocaleString(undefined,{maximumFractionDigits:2})
  : "$"+Number(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});

function render(){
  if(!data) return;
  const arr=(data[market]?.short||[]).slice(0,10);
  const jp=market==="japan";
  document.getElementById("title").textContent=(jp?"日本株":"米国株")+" 新規買い候補 TOP10";
  document.getElementById("updated").textContent="更新日 "+(data.updated_at||"—")+" ｜ 取引終了後の日次更新";
  document.getElementById("jp").classList.toggle("active",jp);
  document.getElementById("us").classList.toggle("active",!jp);
  const list=document.getElementById("list");
  if(!arr.length){
    list.innerHTML='<div class="error">候補データがありません。</div>';
    return;
  }
  list.innerHTML=arr.map((x,i)=>{
    const ch=Number(x.change_pct||0);
    const cls=ch>=0?"up":"down";
    const sign=ch>=0?"+":"";
    const sig=x.signal==="最有力"?"強い買い候補":x.signal==="有力"?"買い候補":"注目候補";
    return `<div class="card">
      <div class="top">
        <div class="rank">${i+1}</div>
        <div>
          <div class="name">${x.name}</div>
          <div class="code">${x.code}</div>
        </div>
        <div>
          <div class="price">${money(x.price)}</div>
          <div class="change ${cls}">${sign}${ch.toFixed(2)}%</div>
        </div>
      </div>
      <div class="bottom">
        <div class="score">総合 ${Number(x.score).toFixed(1)}</div>
        <div class="signal">${sig}</div>
      </div>
    </div>`;
  }).join("");
}

document.getElementById("jp").onclick=()=>{market="japan";render()};
document.getElementById("us").onclick=()=>{market="usa";render()};

fetch("tenx_data.json?ts="+Date.now(),{cache:"no-store"})
 .then(r=>{if(!r.ok) throw new Error("HTTP "+r.status); return r.json()})
 .then(d=>{data=d;render()})
 .catch(e=>{
   document.getElementById("updated").textContent="データ読込エラー";
   document.getElementById("list").innerHTML='<div class="error">tenx_data.json を読み込めませんでした。</div>';
 });
</script>
</body>
</html>
