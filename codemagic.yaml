          js_visible={"まだ保有株の登録はありません。":"No holdings yet.","お気に入りはまだありません。":"No favorites yet.","分析履歴はまだありません。":"No analysis history yet.","スコア ":"Score ","株｜購入 ":" shares | Buy ","｜現在 ":" | Current ","現在値を更新":"Update Current Price","現在値を反映":"Apply Current Price","情報確認":"View Info","分析を編集":"Edit Analysis","削除":"Delete","別分析として開く":"Open as New Analysis","この分析を開く":"Open Analysis","メモなし":"No memo","分析履歴をすべて消去しますか？":"Delete all analysis history?","消去しました":"Deleted.","保有株・お気に入り・分析履歴をすべて消去しますか？":"Delete Portfolio, Favorites, and Analysis History?","すべて消去しました":"All saved data deleted.","データを読み込みました":"Data imported.","10X STOCK ZEROのバックアップファイルを読み込めませんでした":"Could not read the 10X STOCK ZERO backup file.","現在値を正しく入力してください":"Enter a valid current price.","この保有株を削除しますか？":"Delete this holding?","お気に入りに追加しました":"Added to Favorites.","分析結果を保存しました":"Analysis saved.","お気に入りに保存しました":"Saved to Favorites.","保有株として保存しました":"Saved to Portfolio.","銘柄コードと会社名を入力してください":"Enter a ticker and company name.","先に銘柄コードを入力してください":"Enter a ticker first."}
