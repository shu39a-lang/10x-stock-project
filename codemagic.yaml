          grep -q 'data-term="mid"' www/index.html
          grep -q 'data-term="long"' www/index.html
          grep -q 'ENGLISH_DISPLAY_ONLY' www/index.html
          grep -q 'SCRIPT","STYLE","NOSCRIPT","TEMPLATE' www/index.html
          grep -q 'https://www.tradingview.com/markets/stocks-japan/market-movers-gainers/' www/index.html
          grep -q 'https://www.tradingview.com/markets/stocks-usa/market-movers-gainers/' www/index.html
          grep -q 'https://www.tradingview.com/symbols/TSE-' www/index.html
          if grep -q 'https://jp.tradingview.com/' www/index.html; then echo "Japanese TradingView URL remains"; exit 1; fi
          if grep -q 'https://finance.yahoo.co.jp/' www/index.html; then echo "Japanese Yahoo Finance URL remains"; exit 1; fi
          test -s www/tenx_history.json
          test -s www/sw.js
          grep -q 'function renderRanking' www/index.html
          grep -q 'calcScore();renderRanking();' www/index.html
          for f in dynamic_rank.js quick_buy_check.js auto_score.js stock_lookup_fix.js; do
            test -s "www/$f"
            cmp -s "main_source/$f" "www/$f" || { echo "STOP: $f differs from proven Japanese main"; exit 1; }
          done
          node --check www/dynamic_rank.js
          echo "VERIFIED: current working main engine + history + service worker + English display layer"

      - name: Create Capacitor project
        script: |
          set -e
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          npx cap init "10X STOCK ZERO" "com.shu39a.tenxstockenglish" --web-dir=www --skip-appid-validation
          npx cap add ios
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.shu39a.tenxstockenglish",
            "appName": "10X STOCK ZERO",
            "webDir": "www",
            "plugins": {"CapacitorHttp":{"enabled":true}}
          }
          JSON
          npx cap sync ios

      - name: Install app icon
        script: |
          set -e
          ICONSET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          cp -f 10X_STOCK_ZERO_AppIcon_1024.png "$ICONSET/AppIcon-512@2x.png"
          cat > "$ICONSET/Contents.json" <<'EOF'
          {"images":[{"filename":"AppIcon-512@2x.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}
          EOF

      - name: Set up code signing
        script: |
          cd ios/App
          xcode-project use-profiles

      - name: Set build number
        script: |
          cd ios/App
          agvtool new-marketing-version 1.0
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Build IPA
        script: |
          cd ios/App
          xcode-project build-ipa --project "App.xcodeproj" --scheme "App"
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
