workflows:
  ios-workflow:
    name: 10X STOCK ZERO iOS
    max_build_duration: 60

    integrations:
      app_store_connect: codemagic7

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.shu39a.10xstock
      xcode: latest
      node: latest

    scripts:
      - name: Prepare web app
        script: |
          mkdir -p www
          HTML_FILE=$(find . -maxdepth 1 -type f \( -name "*.html" -o -name "*.htm" \) | head -1)
          if [ -z "$HTML_FILE" ]; then
            echo "ERROR: HTML file not found"
            exit 1
          fi
          cp "$HTML_FILE" www/index.html

      - name: Create Capacitor project
        script: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          npx cap init  "10X STOCK ZERO" "com.shu39a.stock10x" --web-dir=www --skip-appid-validation
          npx cap add ios
          npx cap sync ios
          perl -pi -e 's/com\.shu39a\.stock10x/com.shu39a.10xstock/g' ios/App/App.xcodeproj/project.pbxproj
      - name: Fetch signing files
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.shu39a.10xstock" --type IOS_APP_STORE --create
          keychain add-certificates
        
        
      - name: Set up code signing
        script: |
          cd ios/App
          xcode-project use-profiles

      - name: Set build number
        script: |
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Build IPA
        script: |
          cd ios/App
          xcode-project build-ipa \
            --project "App.xcodeproj" \
            --scheme "App"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
