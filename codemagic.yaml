      - name: Fix English layout spacing
        script: |
          set -e
          python3 - <<'PY'
          from pathlib import Path

          p = Path("www/index.html")
          s = p.read_text(encoding="utf-8")

          marker = "<!-- TENX_ENGLISH_LAYOUT_FIX_20260919 -->"
          if marker not in s:
              css = r"""
<!-- TENX_ENGLISH_LAYOUT_FIX_20260919 -->
<style>
/* Analysis screen: keep Japan Stocks / U.S. Stocks fully inside the buttons. */
#analysisMarketJapan,
#analysisMarketUs{
  min-width:0 !important;
  font-size:10px !important;
  padding:4px 1px !important;
  white-space:nowrap !important;
  overflow:hidden !important;
  line-height:1 !important;
}
#analysisMarketJapan span,
#analysisMarketUs span{
  font-size:14px !important;
}

/* Home TOP10 title:
   wrapped second line starts exactly where "Japan" starts. */
#rankingTitle{
  padding-left:30px !important;
  text-indent:-30px !important;
  line-height:1.25 !important;
}
</style>
"""
              s = s.replace("</head>", css + "\n</head>", 1)
              p.write_text(s, encoding="utf-8")

          print("PASS: English market-button overflow and TOP10 heading alignment fixed.")
          PY
