      - name: Keep live rankings and enforce English company names
        script: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('www/dynamic_rank.js')
          s = p.read_text(encoding='utf-8')

          helper = r'''
          function tenxEnglishRankName(row) {
            const code = String(row.code || '').trim().toUpperCase().replace(/\.T$/, '');
            const official = {
              '4498': 'Cybertrust Japan Co., Ltd.',
              '3042': 'SecuAvail Inc.',
              '7453': 'Ryohin Keikaku Co., Ltd.',
              '2914': 'Japan Tobacco Inc.',
              '2802': 'Ajinomoto Co., Inc.',
              '9433': 'KDDI Corporation',
              '8725': 'MS&AD Insurance Group Holdings',
              '8630': 'SOMPO Holdings',
              '8795': 'T&D Holdings',
              '7751': 'Canon Inc.'
            };
            let name = String(official[code] || ENGLISH_RANK_NAME_BY_CODE[code] || row.name_en || row.name || code);
            if (/[\u3040-\u30ff\u3400-\u9fff]/.test(name)) name = code;
            return name;
          }
          '''
          anchor = 'function convertRows(rows,market){'
          if s.count(anchor) != 1 or 'const ENGLISH_RANK_NAME_BY_CODE=' not in s:
              raise SystemExit('STOP: unexpected English ranking structure')
          s = s.replace(anchor, helper + '\n' + anchor, 1)

          pattern = r'String\(ENGLISH_RANK_NAME_BY_CODE\[[^\n]*?item\.x\.code \|\| ""\),'
          s, count = re.subn(pattern, 'tenxEnglishRankName(item.x),', s, count=1)
          if count != 1:
              raise SystemExit('STOP: English ranking name expression not found')
          p.write_text(s, encoding='utf-8')
          print('PASS: live ranking is unchanged; stock names display in English')
          PY
          node --check www/dynamic_rank.js
