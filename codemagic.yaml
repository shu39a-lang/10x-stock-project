workflows:
  ios-workflow:
    name: 10X STOCK ZERO English iOS
    max_build_duration: 60

    integrations:
      app_store_connect: codemagic7

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.shu39a.tenxstockenglish
      xcode: latest
      node: latest

    scripts:
      - name: Copy proven working app
        script: |
          set -e
          rm -rf www
          mkdir -p www

          BASE="https://raw.githubusercontent.com/shu39a-lang/10x-stock-project/main"
          for f in \
            index.html dynamic_rank.js quick_buy_check.js auto_score.js stock_lookup_fix.js \
            tenx_data.json tenx_history.json live_quotes.json manifest.webmanifest sw.js \
            icon-192.png icon-512.png apple-touch-icon.png 10X_STOCK_ZERO_AppIcon_1024.png
          do
            curl -fL --retry 3 "$BASE/$f" -o "www/$f" || true
          done

          cp -f privacy.html terms.html support.html www/

          test -s www/index.html
          test -s www/dynamic_rank.js
          test -s www/quick_buy_check.js
          test -s www/auto_score.js
          test -s www/stock_lookup_fix.js
          test -s www/tenx_data.json

      - name: Add English company display names
        script: |
          set -e
          python3 -m pip install --quiet yfinance
          python3 - <<'PY'
          from pathlib import Path
          import json, re, time
          import yfinance as yf

          p=Path("www/tenx_data.json")
          data=json.loads(p.read_text(encoding="utf-8"))

          fallback={
            "6203":"Howa Machinery","8001":"ITOCHU Corporation","5301":"Tokai Carbon",
            "6701":"NEC Corporation","6702":"Fujitsu","8750":"Dai-ichi Life Holdings",
            "4588":"Oncolys BioPharma","4689":"LY Corporation","9432":"NTT",
            "6857":"Advantest","8035":"Tokyo Electron","9984":"SoftBank Group",
            "7203":"Toyota Motor","6758":"Sony Group","6861":"Keyence","6501":"Hitachi",
            "MU":"Micron Technology","TSM":"Taiwan Semiconductor Manufacturing",
            "CVE":"Cenovus Energy","PBR":"Petrobras","PBR-A":"Petrobras",
            "SU":"Suncor Energy","OXY":"Occidental Petroleum","DELL":"Dell Technologies",
            "NU":"Nu Holdings","NVDA":"NVIDIA","AAPL":"Apple","MSFT":"Microsoft",
            "AMZN":"Amazon","META":"Meta Platforms","GOOGL":"Alphabet"
          }

          def clean(code):
              return str(code or "").strip().upper().replace(".T","")

          def fetch_name(market,code):
              c=clean(code)
              symbol=c+".T" if market=="japan" else c
              try:
                  info=yf.Ticker(symbol).info or {}
                  for k in ("longName","shortName","displayName"):
                      name=str(info.get(k) or "").strip()
                      if re.search(r"[A-Za-z]",name):
                          return name
              except Exception:
                  pass
              return fallback.get(c,"")

          for market in ("japan","usa"):
              group=data.get(market) or {}
              codes=[]
              for key in ("all","short","medium","mid","long"):
                  for row in group.get(key) or []:
                      c=clean(row.get("code"))
                      if c and c not in codes:
                          codes.append(c)

              names={}
              for i,c in enumerate(codes,1):
                  n=fetch_name(market,c)
                  if n:
                      names[c]=n
                  if i%20==0:
                      time.sleep(0.15)

              for key in ("all","short","medium","mid","long"):
                  for row in group.get(key) or []:
                      c=clean(row.get("code"))
                      if c in names:
                          row["name_jp"]=row.get("name","")
                          row["name_en"]=names[c]
                          row["name"]=names[c]
                      else:
                          row["name_jp"]=row.get("name","")
                          row["name_en"]=fallback.get(c,c)
                          row["name"]=fallback.get(c,c)

          p.write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding="utf-8")
          print("English display names added without changing scores or ranking order.")
          PY

