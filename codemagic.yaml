workflows:
  ios-workflow:
    name: 10X STOCK ZERO iOS
    max_build_duration: 60
    environment:
      xcode: latest
      node: latest
    scripts:
      - name: Prepare web app
        script: |
          mkdir -p www
          HTML_FILE=$(find . -maxdepth 1 -type f \( -name "*.html" -o -name "*.htm" \) | head -1)
          if [ -z "$HTML_FILE" ]; then
            echo "ERROR: HTML file not found"
            exit 1
          fi
          cp "$HTML_FILE" www/index.html

      - name: Create Capacitor project
        script: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          npx cap init "10X STOCK ZERO" "com.stockzero.app" --web-dir=www
          npx cap add ios
          npx cap sync ios

      - name: Build iOS
        script: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - ios/App/build/**/*
