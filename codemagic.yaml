                "Value ${v.valuation} | Quality & Growth ${v.quality} | Financial ${v.financial} | Technical ${v.technical} | Catalyst ${v.catalyst}",
              'toLocaleString("ja-JP")':'toLocaleString("en-US")'
          }
          for a,b in exact.items():
              x=x.replace(a,b)

          about_pattern=re.compile(
              r'(<div class="sectionbox" style="margin-top:14px">\s*'
              r'<div class="sectiontitle">📊 About 10X STOCK ZERO</div>).*?'
              r'(?=<div class="sectionbox" style="margin-top:14px">\s*'
              r'<div class="sectiontitle">📄 Legal & Support</div>)',
              re.S
          )
          ABOUT_HTML = '<div class="sectionbox" style="margin-top:14px">\n  <div class="sectiontitle">📊 About 10X STOCK ZERO</div>\n\n  <div class="note" style="font-size:11px;line-height:1.75;color:#d7e0ea">\n    10X STOCK ZERO screens a large number of Japan and U.S. stocks, considers liquidity, and combines multiple indicators for an overall assessment.\n    <br><br>\n\n    <b style="color:#ffc73d">Five Key Analysis Factors</b><br>\n    • Quality & Growth 25%<br>\n    • Technical Analysis 25%<br>\n    • Valuation 20%<br>\n    • Financial Health 15%<br>\n    • Growth Potential 15%\n    <br><br>\n\n    Technical analysis uses 20-day, 50-day, and 200-day moving averages, RSI, MACD, volume, and price momentum. Financial and company analysis considers PER, PBR, PSR, revenue growth, profit growth, ROE, profit margin, cash flow, and debt levels.\n    <br><br>\n\n    Different criteria are applied to Short Term, Mid Term, and Long Term, and TOP10 stocks are selected for each time horizon.\n    <br><br>\n\n    <span style="color:#93a2b5">\n      Scores and rankings do not guarantee future price increases or profits. Ratings may change with market conditions and company information. Make final investment decisions based on your own judgment.\n    </span>\n  </div>\n</div>\n\n'
          x,n=about_pattern.subn(ABOUT_HTML,x,count=1)
          if n!=1:
              raise SystemExit("STOP: About section was not found for final cleanup")

          p.write_text(x,encoding="utf-8")

          q=Path("www/quick_buy_check.js")
          z=q.read_text(encoding="utf-8")
          for a,b in {
              "Top Gainers Ranking":"Top Gainers",
              "Top Losers Ranking":"Top Losers",
              "Volume Ranking Ranking":"Volume Ranking",
              "Top Gainersランキング":"Top Gainers",
              "Top Losersランキング":"Top Losers",
              "Volumeランキング":"Volume Ranking"
          }.items():
              z=z.replace(a,b)
          q.write_text(z,encoding="utf-8")

          # Final ranking-grade and remaining Settings text fix.
          p=Path("www/index.html")
          x=p.read_text(encoding="utf-8")

          # A one-letter stock ticker (such as C) must never overwrite the grade function.
          x,n_grade=re.subn(
              r'function grade\(s\)\{return .*?\}',
              'function grade(s){return s>=71?"A":s>=68?"B":s>=65?"C":"D"}',
              x,
              count=1
          )
          if n_grade != 1:
              raise SystemExit("STOP: grade function not found")

          # Remove the last Japanese subtitle in Settings & More.
          x=x.replace(
              "10X STOCK ZERO 最終完成版 v1.0",
              "10X STOCK ZERO Final Version v1.0"
          )

          p.write_text(x,encoding="utf-8")

          # Final layout-only fix: labels and TOP10 heading alignment.
          p=Path("www/index.html")
          x=p.read_text(encoding="utf-8")

          x=x.replace(
              '<span style="font-size:17px">🇯🇵</span> Japan Stocks</button>',
              '<span style="font-size:17px">🇯🇵</span> Japan</button>',
              1
          )
          x=x.replace(
              '<span style="font-size:17px">🇺🇸</span> U.S. Stocks</button>',
              '<span style="font-size:17px">🇺🇸</span> U.S.</button>',
              1
          )

          layout_css = """<style id="tenx-english-layout-fix">
          #analysisMarketJapan,#analysisMarketUs{
            min-width:0!important;
            font-size:14px!important;
            padding:4px 3px!important;
            white-space:nowrap!important;
            overflow:hidden!important;
            line-height:1!important;
          }
          #analysisMarketJapan span,#analysisMarketUs span{
            font-size:17px!important;
          }
          #rankingTitle{
            padding-left:30px!important;
            text-indent:-30px!important;
            line-height:1.25!important;
          }
          </style>"""
          x=x.replace("</head>",layout_css+"\n</head>",1)
          p.write_text(x,encoding="utf-8")
          PY

      - name: Final verification before building
        script: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          idx=Path("www/index.html").read_text(encoding="utf-8")

          if "./tenx_data.json" not in Path("www/dynamic_rank.js").read_text(encoding="utf-8"):
              raise SystemExit("STOP: ranking is not wired to packaged English data")
          if "ENGLISH_NAME_BY_CODE" not in Path("www/stock_lookup_fix.js").read_text(encoding="utf-8"):
              raise SystemExit("STOP: English search-name map missing")

          dyn=Path("www/dynamic_rank.js").read_text(encoding="utf-8")
          quick=Path("www/quick_buy_check.js").read_text(encoding="utf-8")
          if "ENGLISH_RANK_NAME_BY_CODE" not in dyn:
              raise SystemExit("STOP: final ranking English-name map missing")
          if 'function applyIfValid(market,term,rows)' not in dyn:
              raise SystemExit("STOP: ranking safety guard missing")
          if "ENGLISH_BUY_NAME_BY_CODE" not in quick:
              raise SystemExit("STOP: Buy Timing English-name map missing")
          if 'icon("chart",22)+" データ・ランキング"' in quick:
              raise SystemExit("STOP: Japanese stable-icon label still present")

          idx=Path("www/index.html").read_text(encoding="utf-8")
          if 'function grade(s){return s>=71?"A":s>=68?"B":s>=65?"C":"D"}' not in idx:
              raise SystemExit("STOP: ranking grade function is not intact")
          if "10X STOCK ZERO 最終完成版 v1.0" in idx:
              raise SystemExit("STOP: Japanese Settings subtitle still present")

          if "(U.S. Stocks)" in idx or "(Japan Stocks)" in idx:
              raise SystemExit("STOP: long update-time market labels still present")
          if "(U.S.)" not in idx or "(Japan)" not in idx:
              raise SystemExit("STOP: short update-time market labels missing")

          for old_handler in [
              '$("#codeInput").addEventListener("change",zeroLookupStock);',
              '$("#codeInput").addEventListener("blur",zeroLookupStock);',
              'if(e.key==="Enter")zeroLookupStock()',
              'await zeroLookupStock();'
          ]:
              if old_handler in idx:
                  raise SystemExit("STOP: original Japanese lookup event still bound: "+old_handler)

          for bad in [
              "Top Gainers<br>ランキング",
              "Top Losers<br>ランキング",
              "Volume<br>ランキング",
              "割安 ${v.valuation}｜品質/成長",
              "10X STOCK ZEROは、Japan Stocks"
          ]:
              if bad in idx:
                  raise SystemExit("STOP: final mixed-language text still present: "+bad)

          # Full app must still be present.
          required=[
            "<!doctype html>",
            "function renderRanking",
            "calcScore();renderRanking();",
            "dynamic_rank.js",
            "quick_buy_check.js",
            "auto_score.js",
            "stock_lookup_fix.js",
            "User Guide",
            "Company Name",
            "Current Price",
            "Buy Timing Analysis",
            "Privacy Policy",
            "Terms of Use"
          ]
          missing=[x for x in required if x not in idx]
          if missing:
              raise SystemExit("STOP: required app content missing: "+repr(missing))


          # Lookup engine must still be intact.
          lookup=Path("www/stock_lookup_fix.js").read_text(encoding="utf-8")
          for token in ["window.zeroLookupStock","CapacitorHttp","yahooDirect","live_quotes.json","tenx_data.json"]:
              if token not in lookup:
                  raise SystemExit("STOP: lookup engine damaged: "+token)


          print("PASS: full app present and lookup engine intact.")
          PY

          node --check www/dynamic_rank.js
          node --check www/quick_buy_check.js
          node --check www/auto_score.js
          node --check www/stock_lookup_fix.js

