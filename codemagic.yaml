              ["米国上場企業","U.S.-listed"],["ランキング",""],["診断結果を表示しました。","Analysis complete."],
              ["※この診断は現在の分析データによる判断目安です。将来の株価上昇や利益を保証するものではありません。","* Based on current data. Not investment advice or a guarantee of future performance."],
