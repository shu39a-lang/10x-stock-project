              ["伊藤忠商事","Itochu"],["ＫＤＤＩ","KDDI"],["KDDI","KDDI"],["ＩＮＰＥＸ","INPEX"],["INPEX","INPEX"],
              ["三井物産","Mitsui & Co."],["デル・テクノロジーズ","Dell Technologies"],["S&P トロント総合指数","S&P/TSX Composite"],
              ["ハスキー・エナジー","Husky Energy"],["ペトロブラス","Petrobras"],["エクソンモービル","Exxon Mobil"],
              ["コノコフィリップス","ConocoPhillips"],["台湾積体電路製造（TSMC）","Taiwan Semiconductor (TSMC)"],
              ["ヌー・ホールディングス","Nu Holdings"],["シェル","Shell"],["シェブロン","Chevron"],["クラウドストライク・ホールディングス","CrowdStrike Holdings"],["メドトロニック","Medtronic"],
