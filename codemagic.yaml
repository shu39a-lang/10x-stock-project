workflows:
  ios-workflow:
    name: 10X STOCK ZERO iOS
    max_build_duration: 60

    integrations:
      app_store_connect: codemagic7

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.shu39a.10xstock
      xcode: latest
      node: latest

    scripts:
      - name: Prepare web app
        script: |
          mkdir -p www
          cp -f index.html www/index.html
          cp -f *.html www/ 2>/dev/null || true
          cp -f *.json www/ 2>/dev/null || true
          cp -f *.js www/ 2>/dev/null || true
          cp -f *.webmanifest www/ 2>/dev/null || true
          cp -f *.png www/ 2>/dev/null || true

      - name: Create Capacitor project
        script: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          npx cap init "10X STOCK ZERO" "com.shu39a.stock10x" --web-dir=www --skip-appid-validation
          npx cap add ios
          printf '{"plugins":{"CapacitorHttp":{"enabled":true}}}' > capacitor.config.json
          npx cap sync ios
          perl -pi -e 's/com\.shu39a\.stock10x/com.shu39a.10xstock/g' ios/App/App.xcodeproj/project.pbxproj

      - name: Install finalized app icon
        script: |
          ICONSET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          sips -z 1024 1024 apple-touch-icon.png --out "$ICONSET/AppIcon-512@2x.png"
          cat > "$ICONSET/Contents.json" <<'EOF'
          {
            "images" : [
              {
                "filename" : "AppIcon-512@2x.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          EOF

      - name: Set up code signing
        script: |
          cd ios/App
          xcode-project use-profiles

      - name: Set build number
        script: |
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Build IPA
        script: |
          cd ios/App
          xcode-project build-ipa \
            --project "App.xcodeproj" \
            --scheme "App"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
