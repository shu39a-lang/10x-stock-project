      - name: Keep ranking logic and show English names
        script: |
          set -e
          python3 - <<'PY'
          from pathlib import Path

          p=Path("www/dynamic_rank.js")
          s=p.read_text(encoding="utf-8")

          s=s.replace(
              '"https://shu39a-lang.github.io/10x-stock-project/tenx_data.json"',
              '"./tenx_data.json"'
          )

          # Safety guard: never replace a working ranking with an empty/incomplete update.
          old_update = '    DATA.japan.short=convertRows(j.japan.short,"japan");\n    DATA.japan.mid=convertRows(j.japan.medium,"japan");\n    DATA.japan.long=convertRows(j.japan.long,"japan");\n\n    DATA.usa.short=convertRows(j.usa.short,"usa");\n    DATA.usa.mid=convertRows(j.usa.medium,"usa");\n    DATA.usa.long=convertRows(j.usa.long,"usa");'
          new_update = '    function applyIfValid(market,term,rows){\n      const converted=convertRows(rows,market);\n      if(Array.isArray(converted) && converted.length>=10){\n        DATA[market][term]=converted;\n      }else{\n        console.log("ranking update skipped:",market,term,"rows=",converted.length);\n      }\n    }\n\n    applyIfValid("japan","short",j.japan.short);\n    applyIfValid("japan","mid",j.japan.medium);\n    applyIfValid("japan","long",j.japan.long);\n\n    applyIfValid("usa","short",j.usa.short);\n    applyIfValid("usa","mid",j.usa.medium);\n    applyIfValid("usa","long",j.usa.long);'
          if old_update in s:
              s=s.replace(old_update,new_update,1)
          elif 'function applyIfValid(market,term,rows)' not in s:
              raise SystemExit("STOP: ranking update block not found")

          old='String(item.x.name || ""),'
          new='String(item.x.name_en || item.x.name || ""),'
          if old not in s:
              raise SystemExit("STOP: dynamic_rank display-name line not found")
          s=s.replace(old,new,1)

          p.write_text(s,encoding="utf-8")
          PY

      - name: Keep lookup logic and show English names
        script: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path("www/stock_lookup_fix.js")
          s=p.read_text(encoding="utf-8")

          import json
          data=json.loads(Path("www/tenx_data.json").read_text(encoding="utf-8"))
          english_names={}
          def walk(node):
              if isinstance(node,list):
                  for v in node: walk(v)
              elif isinstance(node,dict):
                  code=str(node.get("code") or "").strip().upper().replace(".T","")
                  name=str(node.get("name_en") or node.get("name") or "").strip()
                  if code and name:
                      english_names[code]=name
                  for v in node.values():
                      walk(v)
          walk(data)
          english_names.update({
              "NU":"Nu Holdings",
              "DELL":"Dell Technologies",
              "TSM":"Taiwan Semiconductor Manufacturing",
              "MU":"Micron Technology",
              "CVX":"Chevron",
              "XOM":"Exxon Mobil",
              "GOOG":"Alphabet",
              "GOOGL":"Alphabet",
              "PBR":"Petrobras",
              "PBR-A":"Petrobras",
              "CVE":"Cenovus Energy",
              "UMC":"United Microelectronics",
              "IAG":"iA Financial Corporation",
              "HPE":"Hewlett Packard Enterprise",
              "FSM":"Fortuna Mining",
              "7203":"Toyota Motor",
              "6501":"Hitachi",
              "8001":"ITOCHU Corporation",
              "6594":"Nidec",
              "6971":"Kyocera",
              "8002":"Marubeni",
              "8725":"MS&AD Insurance Group Holdings",
              "8601":"Daiwa Securities Group",
              "8053":"Sumitomo Corporation"
          })
          name_blob=json.dumps(english_names,ensure_ascii=False)

          if "const ENGLISH_NAME_BY_CODE=" not in s:
              s=s.replace(
                  'const $=s=>document.querySelector(s);',
                  'const $=s=>document.querySelector(s);\nconst ENGLISH_NAME_BY_CODE='+name_blob+';',
                  1
              )

          s=s.replace(
              'const ROOT="https://shu39a-lang.github.io/10x-stock-project/";',
              'const ROOT="./";'
          )

          s=s.replace(
              'const tenxName=String(tenx?.name||"").trim();',
              'const tenxName=String(tenx?.name_en||tenx?.name||"").trim();',
              1
          )
          name_block=re.compile(r'  if\(market==="japan"\)\{.*?\n  \}\n\n  const source=',re.S)
          s,changed=name_block.subn('  const fixedEnglishName=ENGLISH_NAME_BY_CODE[code]||"";\n  name=fixedEnglishName||tenxName||directName||code;\n\n  const source=',s,count=1)
          if changed!=1:
              raise SystemExit("STOP: lookup name-display block not found")

          translations={
            'st.textContent="✓ "+name+" ｜ 現在値 "+':
              'st.textContent="✓ "+name+" | Current Price "+',
            'st.textContent="✓ "+name+" を確認しました。現在値は取得できませんでした。";':
              'st.textContent="✓ "+name+" found. Current price is unavailable.";',            'st.textContent="自動取得できませんでした。会社名と現在値を手入力できます。";':
              'st.textContent="Automatic retrieval failed. Enter the company name and current price manually.";',
            'st.textContent="コードを入力すると会社名と現在値を確認します。";':
              'st.textContent="Enter a ticker to check the company name and current price.";',
            'st.textContent="会社名・現在値を検索中…";':
              'st.textContent="Loading company name and current price…";'
          }
          for a,b in translations.items():
              s=s.replace(a,b)

          p.write_text(s,encoding="utf-8")
          PY

