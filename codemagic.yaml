workflows:
  ios-workflow:
    name: 10X STOCK ZERO English iOS
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic7
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.shu39a.tenxstockenglish
      xcode: latest
      node: latest
    scripts:
      - name: Copy the known-working Japanese app
        script: |
          set -e
          rm -rf www
          mkdir -p www main_source
          BASE="https://raw.githubusercontent.com/shu39a-lang/10x-stock-project/59b0ed17dabeb9c8993645e543d251b8ce55487b"
          for f in dynamic_rank.js quick_buy_check.js auto_score.js stock_lookup_fix.js; do
            curl -fL --retry 3 "$BASE/$f" -o "main_source/$f"
            test -s "main_source/$f"
          done
          BASE="https://raw.githubusercontent.com/shu39a-lang/10x-stock-project/main"
          for f in index.html dynamic_rank.js quick_buy_check.js auto_score.js stock_lookup_fix.js tenx_data.json tenx_history.json live_quotes.json manifest.webmanifest sw.js privacy.html terms.html support.html; do
            curl -fL "$BASE/$f" -o "www/$f" || true
          done
          cp -f *.png www/ 2>/dev/null || true
          test -s www/index.html
          test -s www/dynamic_rank.js
          grep -q 'function renderRanking' www/index.html
          grep -q 'calcScore();renderRanking();' www/index.html

      - name: Add English display without replacing app logic
        script: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p=Path("www/index.html")
          s=p.read_text(encoding="utf-8")
          s=s.replace('<html lang="ja">','<html lang="en">',1)

          # Direct English source-text conversion for the English build only.
          direct_ui = {
            "銘柄を確認・入力して分析":"Check & Analyze a Stock","市場":"Market","銘柄コード":"Ticker","会社名":"Company Name",
            "株数":"Shares","購入単価":"Buy Price","現在値":"Current Price","メモ":"Memo","任意":"Optional",
            "コードを入力すると会社名と現在値を確認します。":"Enter a ticker to load company name and current price.",
            "株価・会社情報を確認":"View Stock Info","入力をクリア":"Clear",
            "割安性（20点）":"Value (20 pts)","品質・成長（25点）":"Quality & Growth (25 pts)","財務（15点）":"Financial (15 pts)",
            "カタリスト（15点）":"Catalyst (15 pts)","テクニカル（25点）":"Technical (25 pts)","格付":"Grade",
            "分析結果を保存":"Save Analysis","保有株として保存":"Save to Portfolio","お気に入り登録":"Add to Favorites",
            "分析履歴":"Analysis History","まだ分析履歴はありません。":"No analysis history yet.",
            "保有株管理":"My Portfolio","まだ保有株の登録はありません。":"No holdings yet.","お気に入りはまだありません。":"No favorites yet.",
            "設定・その他":"Settings & More","バックアップを保存":"Save Backup","バックアップから復元":"Restore from Backup",
            "分析履歴を消去":"Clear Analysis History","全保存データを消去":"Delete All Data","ホームへ戻る":"Back to Home",
            "10X STOCK ZEROの分析について":"About 10X STOCK ZERO","主な5つの分析項目":"Five Key Analysis Factors",
            "企業の質・成長性 25%":"Quality & Growth 25%","テクニカル分析 25%":"Technical Analysis 25%",
            "割安性 20%":"Valuation 20%","財務安全性 15%":"Financial Health 15%","成長材料 15%":"Growth Potential 15%",
            "法務・サポート":"Legal & Support","プライバシーポリシー":"Privacy Policy","利用規約":"Terms of Use","サポート":"Support",
            "使い方ガイド":"User Guide","1. 市場と期間を選ぶ":"1. Select a Market and Term","2. TOP10を見る":"2. View the TOP10 Ranking",
            "3. TOP10の更新時間":"3. Check Update Times","順位":"Rank","コード":"Ticker","銘柄名":"Company","スコア":"Score",
            "日本株":"Japan Stocks","米国株":"U.S. Stocks","短期":"Short Term","中期":"Mid Term","長期":"Long Term",
            "上昇期待":"Upside Potential","安定上昇":"Steady Growth","成長株":"Growth Stock",
            "買いタイミング診断":"Buy Timing Analysis","診断する":"Analyze","総合判断":"Overall Rating","判断の理由":"Reason",
            "総合スコア":"Overall Score","総合":"Overall","テクニカル":"Technical","トレンド":"Trend","様子見":"Wait","慎重":"Caution",
            "トヨタ自動車":"Toyota Motor","出光興産":"Idemitsu Kosan","ＥＮＥＯＳホールディングス":"ENEOS Holdings",
            "伊藤忠商事":"Itochu","三井物産":"Mitsui & Co.","住友商事":"Sumitomo Corporation","丸紅":"Marubeni","富士通":"Fujitsu",
            "カプコン":"Capcom","商船三井":"Mitsui O.S.K. Lines","ヌー・ホールディングス":"Nu Holdings","シェル":"Shell",
            "シェブロン":"Chevron","クラウドストライク・ホールディングス":"CrowdStrike Holdings","メドトロニック":"Medtronic",
            "台湾積体電路製造（TSMC）":"Taiwan Semiconductor (TSMC)","ペトロブラス":"Petrobras","エクソンモービル":"Exxon Mobil",
            "コノコフィリップス":"ConocoPhillips",
            "ホーム画面で「Japan Stocks」または「U.S. Stocks」を選び、投資期間を選択します。":"On the Home screen, choose Japan Stocks or U.S. Stocks, then select an investment term.",
            "選択した市場と期間に合わせて、TOP10が切り替わります。":"The TOP10 ranking changes according to the selected market and term.",
            "TOP10には、銘柄コード・銘柄名・総合スコア・格付が表示されます。":"TOP10 shows the ticker, company name, overall score, and grade.",
            "順位左側の色は、銘柄の特徴を示しています。":"The color beside each rank indicates the stock's characteristics.",
            "データは、原則として日本時間の次の時刻に更新されます。":"Data is generally updated at the following times (Japan time)."
          }
          for old,new in sorted(direct_ui.items(), key=lambda kv: len(kv[0]), reverse=True):
              s=s.replace(old,new)

          # DIRECT SOURCE ENGLISH — translate the successful Japanese source before packaging.
          source_english={'みずほフィナンシャルグループ': 'Mizuho Financial Group', 'ニデック': 'Nidec', 'レオパレス２１': 'Leopalace21', '豊和工業': 'Howa Machinery', '日本たばこ産業': 'Japan Tobacco', '日本製鉄': 'Nippon Steel', '野村ホールディングス': 'Nomura Holdings', 'ＳＯＭＰＯホールディングス': 'SOMPO Holdings', '武田薬品工業': 'Takeda Pharmaceutical', 'デル・テクノロジーズ': 'Dell Technologies', 'S&P トロント総合指数': 'S&P/TSX Composite', 'ハスキー・エナジー': 'Husky Energy', 'ペトロブラス': 'Petrobras', 'エクソンモービル': 'Exxon Mobil', 'コノコフィリップス': 'ConocoPhillips', '使い方ガイド': 'User Guide', '株式分析ツール': 'Stock Analysis Tool', '日本株': 'Japan Stocks', '米国株': 'U.S. Stocks', '短期': 'Short Term', '中期': 'Mid Term', '長期': 'Long Term', '〜6か月': 'Up to 6 months', '6か月〜1年': '6–12 months', '1年以上': '1+ year', '全て見る 〉': 'View All 〉', '11〜20位を見る': 'View 11–20', 'TOP10に戻る': 'Back to TOP10', '順位': 'Rank', 'コード': 'Ticker', '銘柄名': 'Company', 'スコア': 'Score', '格付': 'Grade', 'ホーム': 'Home', '分析結果': 'Analysis', '保有株': 'Portfolio', 'お気に入り': 'Favorites', '設定・その他': 'Settings & More', '銘柄を確認・入力して分析': 'Check & Analyze a Stock', '新規銘柄・保有株を5項目で分析': 'Analyze stocks using 5 factors', '📊 データ・ランキング': '📊 Data & Rankings', '値上がり': 'Top Gainers', '値下がり': 'Top Losers', '出来高': 'Volume', '急増': 'Surge', '決算カレンダー': 'Earnings Calendar', '52週高値': '52-Week High', 'セクター動向': 'Sector Trends', 'スクリーナー': 'Screener', '📋 分析・検索': '📋 Analysis & Search', '個別銘柄検索': 'Stock Search', '分析履歴': 'Analysis History', 'アドバンテスト': 'Advantest', '東京エレクトロン': 'Tokyo Electron', '三菱重工業': 'Mitsubishi Heavy Industries', 'フジクラ': 'Fujikura', 'ソフトバンクG': 'SoftBank Group', 'ソフトバンクグループ': 'SoftBank Group', '日立製作所': 'Hitachi', 'トヨタ自動車': 'Toyota Motor', '三菱UFJ FG': 'Mitsubishi UFJ Financial Group', '三菱UFJフィナンシャル・グループ': 'Mitsubishi UFJ Financial Group', '信越化学工業': 'Shin-Etsu Chemical', 'ダイキン工業': 'Daikin Industries', '三菱商事': 'Mitsubishi Corporation', '東京海上HD': 'Tokio Marine Holdings', 'ソニーグループ': 'Sony Group', '日本電信電話': 'NTT', '任天堂': 'Nintendo', 'キーエンス': 'Keyence', 'リクルートホールディングス': 'Recruit Holdings', '買いタイミング診断': 'Buy Timing Analysis', '気になる銘柄コードを入力して、現在の買い条件を確認': 'Enter a ticker to check the current buy conditions', '診断する': 'Analyze', '現在の分析データを使って判定します。': 'Uses current analysis data.', '診断結果を表示しました。': 'Analysis complete.', '総合判断': 'Overall Rating', '様子見': 'Wait', '慎重': 'Caution', '買い': 'Buy', '強い買い': 'Strong Buy', '総合': 'Overall', 'テクニカル': 'Technical', 'トレンド': 'Trend', '判断の理由': 'Reason', '総合スコア': 'Overall Score', '品質・成長': 'Quality & Growth', '財務': 'Financial', '割安性': 'Value', 'カタリスト': 'Catalyst', '市場': 'Market', '銘柄コード': 'Ticker', '会社名': 'Company Name', '株数': 'Shares', '購入単価': 'Buy Price', '現在値': 'Current Price', 'メモ': 'Memo', '任意': 'Optional', '株価・会社情報を確認': 'View Stock Info', '入力をクリア': 'Clear', '外部サイトで情報を確認し、5項目を0〜100で評価すると自動で総合スコアを計算します。': 'Check external information and rate 5 factors from 0–100 to calculate the overall score.', 'コードを入力すると会社名と現在値を確認します。': 'Enter a ticker to check the company name and current price.', '注目・急増・高値': 'Watch, Surge & Highs', '管理・設定': 'Management & Settings', '保有株管理': 'Holdings', '保有銘柄の管理': 'Manage holdings', '設定': 'Settings', '各種設定': 'App settings', '登録銘柄一覧': 'Saved stocks', '過去の分析結果': 'Past analysis results', '銘柄コード・銘柄名で検索': 'Search by ticker or company', 'すぐ使う': 'Quick Access', '銘柄分析': 'Stock Analysis', 'データ・': 'Data & Rankings', '保存・管理': 'Portfolio & Management', 'ヘルプ': 'Help', 'バックアップを保存': 'Save Backup', 'バックアップから復元': 'Restore from Backup', '分析履歴を消去': 'Clear Analysis History', '全保存データを消去': 'Delete All Data', 'ホームへ戻る': 'Back to Home', '10X STOCK ZEROの分析について': 'About 10X STOCK ZERO', '主な5つの分析項目': 'Five Key Analysis Factors', '企業の質・成長性 25%': 'Quality & Growth 25%', 'テクニカル分析 25%': 'Technical Analysis 25%', '割安性 20%': 'Valuation 20%', '財務安全性 15%': 'Financial Health 15%', '成長材料 15%': 'Growth Potential 15%', '最終完成版': 'Final Complete', '出光興産': 'Idemitsu Kosan', 'ＥＮＥＯＳホールディングス': 'ENEOS Holdings', 'ENEOSホールディングス': 'ENEOS Holdings', '伊藤忠商事': 'Itochu', '三井物産': 'Mitsui & Co.', '台湾積体電路製造（TSMC）': 'Taiwan Semiconductor (TSMC)', 'ヌー・ホールディングス': 'Nu Holdings', 'シェル': 'Shell', 'シェブロン': 'Chevron', 'クラウドストライク・ホールディングス': 'CrowdStrike Holdings', 'メドトロニック': 'Medtronic', 'レオパレス21': 'Leopalace21', '住友商事': 'Sumitomo Corporation', 'カプコン': 'Capcom', '丸紅': 'Marubeni', '商船三井': 'Mitsui O.S.K. Lines', '富士通': 'Fujitsu', 'この端末に保存した保有銘柄です。損益は入力した現在値で計算します。': 'Manage your holdings saved on this device.', 'まだ保有株の登録はありません。': 'No holdings yet.', 'お気に入りはまだありません。': 'No favorites yet.', '保有株から登録した銘柄です。': 'Stocks you have added to Favorites.', 'やHoldingsから登録した銘柄です。': 'Stocks you have added to Favorites.', '◎ 選択中：': '◎ Selected: ', '🏆 日本株・短期 TOP10': '🏆 Japan Stocks • Short Term TOP10', '🟥 赤：上昇期待\u3000\u3000🟦 青：安定上昇\u3000\u3000🟨 黄：成長株': '🟥 Upside   🟦 Steady   🟨 Growth', '🕒 TOP10 データ更新時間（日本時間）': '🕒 TOP10 Data Update Time (JST)', '06:30頃': 'Around 06:30', '16:00頃': 'Around 16:00', '（アメリカ株）': '(U.S. Stocks)', '（日本株）': '(Japan Stocks)', '米国上場企業': 'U.S.-listed', 'ランキング': '', '※この診断は現在の分析データによる判断目安です。将来の株価上昇や利益を保証するものではありません。': '* Based on current data. Not investment advice or a guarantee of future performance.', '総合スコアは慎重に確認したい水準です。': 'Overall score is at a moderate level.', 'テクニカル面はまだ弱めです。': 'Technical indicators are still weak.', '財務評価には確認余地があります。': 'Financial metrics require further review.', '10X STOCK ZEROは、Japan Stocks・U.S. Stocksの市場データから多数の銘柄をスクリーニングし、流動性を考慮したうえで、複数の指標を組み合わせて総合評価しています。': '10X STOCK ZERO screens many stocks using Japan and U.S. market data, considers liquidity, and combines multiple indicators to produce an overall evaluation.', 'テクニカル分析では、20日・50日・200日移動平均、RSI、MACD、出来高、株価モメンタムなどを使用しています。財務・企業分析では、PER、PBR、PSR、売上成長、利益成長、ROE、利益率、キャッシュフロー、負債水準などを参考にしています。': 'Technical analysis uses 20-day, 50-day, and 200-day moving averages, RSI, MACD, volume, and price momentum. Financial and company analysis references PER, PBR, PSR, revenue growth, profit growth, ROE, profit margin, cash flow, and debt levels.', 'Short Term・Mid Term・Long Termではそれぞれ異なる条件を適用し、各期間別に適した銘柄を評価してTOP10を選定しています。': 'Different criteria are applied to Short Term, Mid Term, and Long Term, and TOP10 stocks are selected for each period.', '企業の質・成長性も高く評価されています。': 'Quality and growth are also rated highly.', '1. 市場と期間を選ぶ': '1. Select a Market and Term', 'ホーム画面で「Japan Stocks」または「U.S. Stocks」を選び、投資期間を選択します。': 'Choose either Japan Stocks or U.S. Stocks on the Home screen, then select the investment term.', 'Short Term：6か月以内': 'Short Term: Up to 6 months', 'Mid Term：6か月〜1年': 'Mid Term: 6–12 months', 'Long Term：1年以上': 'Long Term: 1+ year', '選択した市場と期間に合わせて、TOP10が切り替わります。': 'The TOP10 ranking changes according to the selected market and term.', '2. TOP10を見る': '2. View the TOP10 Ranking', 'TOP10には、銘柄コード・銘柄名・総合スコア・格付が表示されます。': 'TOP10 shows the ticker, company name, overall score, and grade.', '「11〜20位を見る」を押すと20位まで表示でき、「TOP10に戻る」を押すと元に戻ります。': 'Tap View 11–20 to show ranks 11–20, and Back to TOP10 to return.', '順位左側の色は、銘柄の特徴を示しています。': 'Rank colors indicate the stock’s characteristics.', '赤：Upside Potential': 'Red: Upside Potential', '青：Steady Growth': 'Blue: Steady Growth', '黄：Growth Stock': 'Yellow: Growth Stock', 'この色分けは銘柄の特徴を表すもので、売買を直接指示するものではありません。': 'These colors describe stock characteristics and do not directly indicate a buy or sell action.', '星印を押すと「Favorites」に登録できます。': 'Tap the star to add a stock to Favorites.', '銘柄コードまたは銘柄名を押すと、外部サイトで詳しい株価情報を確認できます。': 'Tap a ticker or company name to view detailed stock information on an external site.', '3. TOP10の更新時間': '3. Check Update Times', 'データは、原則として日本時間の次の時刻に更新されます。': 'Data is generally updated at the following times (Japan time).', 'U.S. Stocks：午前6時30分頃': 'U.S. Stocks: Around 6:30 AM', 'Japan Stocks：午後4時頃': 'Japan Stocks: Around 4:00 PM', '選択中：': 'Selected: ', 'データ更新時間（日本時間）': 'Data Update Times (Japan Time)', 'アメリカ株': 'U.S. Stocks', 'お気に入りと保有株管理': 'Favorites & Portfolio', '設定・バックアップ': 'Settings & Backup', '重要な注意事項': 'Important Notes', 'TOP10や分析画面で登録した銘柄を一覧で確認できます。気になる銘柄を継続して確認するときに使用します。': 'View stocks saved from the TOP10 or Analysis screen. Use Favorites to keep track of stocks you want to monitor.', '保有株の株数、購入単価、現在値、損益額、損益率を確認できます。「現在値を反映」を押すと、取得可能な最新株価へ更新します。取得できない場合は現在値を手入力できます。': 'View shares, purchase price, current price, profit/loss, and return for your holdings. Tap Update Current Price to load the latest available price. If unavailable, enter it manually.', '保有株、お気に入り、分析履歴などは端末内に保存されます。機種変更や再インストールに備え、定期的にバックアップを保存してください。': 'Holdings, Favorites, and Analysis History are stored on this device. Save backups regularly in case you change devices or reinstall the app.', '10X STOCK ZEROのスコア、ランキング、買いタイミング診断は、株式分析を補助するための判断目安です。特定銘柄の購入や売却を勧めるものではなく、将来の株価上昇や利益を保証するものではありません。': '10X STOCK ZERO scores, rankings, and Buy Timing Analysis are reference tools for stock analysis. They do not recommend buying or selling any specific stock and do not guarantee future price increases or profits.', '市場環境、決算、ニュース、為替などによって評価や株価は変動します。最終的な投資判断は、外部サイトの最新情報も確認したうえで、利用者ご自身の責任で行ってください。': 'Scores and prices may change with market conditions, earnings, news, exchange rates, and other factors. Make investment decisions using your own judgment after checking current external information.', '9. お気に入りと保有株管理': '9. Favorites & Portfolio', '10. 設定・バックアップ': '10. Settings & Backup', '6. 分析結果を保存する': '6. Save Analysis Results', '7. データ・ランキングのリンク': '7. Data & Ranking Links', '8. 注目・急増・高値のリンク': '8. Watch, Surge & High Links'}
          for old,new in sorted(source_english.items(), key=lambda kv: len(kv[0]), reverse=True):
              s=s.replace(old,new)

          # Dynamic ranking names: display-only conversion; DATA and ranking math remain untouched.
          company_english={k:v for k,v in source_english.items() if any(ch in k for ch in "アドバンテスト東京三菱日立トヨタ富士通丸紅伊藤忠商事みずほニデックレオパレス豊和日本製鉄野村武田ヌーシェルシェブロンデルペトロブラス")}
          helper="<script>window.tenxEnglishName=function(code,name){const m="+repr(company_english)+";return m[name]||name;};</script>"
          s=s.replace("</head>",helper+"\\n</head>",1)
          s=s.replace('>${x[1]}</a>', '>${window.tenxEnglishName(x[0],x[1])}</a>')

          # Convert all user-facing market links from Japanese destinations to English destinations.
          url_map={
            "https://finance.yahoo.co.jp/stocks/ranking/up?market=all":"https://www.tradingview.com/markets/stocks-japan/market-movers-gainers/",
            "https://finance.yahoo.co.jp/stocks/us/ranking/up":"https://www.tradingview.com/markets/stocks-usa/market-movers-gainers/",
            "https://finance.yahoo.co.jp/stocks/ranking/down?market=all":"https://www.tradingview.com/markets/stocks-japan/market-movers-losers/",
            "https://finance.yahoo.co.jp/stocks/us/ranking/down":"https://www.tradingview.com/markets/stocks-usa/market-movers-losers/",
            "https://finance.yahoo.co.jp/stocks/ranking/volume?market=all&term=daily":"https://www.tradingview.com/markets/stocks-japan/market-movers-active/",
            "https://finance.yahoo.co.jp/stocks/us/ranking/volume":"https://www.tradingview.com/markets/stocks-usa/market-movers-active/",
            "https://jp.tradingview.com/":"https://www.tradingview.com/"
          }
          for old,new in url_map.items(): s=s.replace(old,new)

          old_stock='function stockUrl(m,c){return m==="japan"?"https://finance.yahoo.co.jp/quote/"+encodeURIComponent(c)+".T":"https://finance.yahoo.co.jp/quote/"+encodeURIComponent(c)}'
          new_stock='function stockUrl(m,c){return m==="japan"?"https://www.tradingview.com/symbols/TSE-"+encodeURIComponent(c)+"/":"https://www.tradingview.com/symbols/"+encodeURIComponent(c)+"/"}'
          if old_stock not in s: raise SystemExit("STOP: stockUrl changed on main")
          s=s.replace(old_stock,new_stock,1)


          p.write_text(s,encoding="utf-8")
          PY

      - name: Verify working engine is still present
        script: |
          set -e
          grep -q '<html lang="en">' www/index.html
          grep -q 'function renderRanking' www/index.html
          grep -q 'calcScore();renderRanking();' www/index.html
          grep -q 'data-market="japan"' www/index.html
          grep -q 'data-market="usa"' www/index.html
          grep -q 'data-term="short"' www/index.html
          grep -q 'data-term="mid"' www/index.html
          grep -q 'data-term="long"' www/index.html
          grep -q 'https://www.tradingview.com/markets/stocks-japan/market-movers-gainers/' www/index.html
          grep -q 'https://www.tradingview.com/markets/stocks-usa/market-movers-gainers/' www/index.html
          grep -q 'https://www.tradingview.com/symbols/TSE-' www/index.html
          if grep -q 'https://jp.tradingview.com/' www/index.html; then echo "Japanese TradingView URL remains"; exit 1; fi
          if grep -q 'https://finance.yahoo.co.jp/' www/index.html; then echo "Japanese Yahoo Finance URL remains"; exit 1; fi
          test -s www/tenx_history.json
          test -s www/sw.js
          grep -q 'function renderRanking' www/index.html
          grep -q 'calcScore();renderRanking();' www/index.html
          for f in dynamic_rank.js quick_buy_check.js auto_score.js stock_lookup_fix.js; do
            test -s "www/$f"
            cmp -s "main_source/$f" "www/$f" || { echo "STOP: $f differs from proven Japanese main"; exit 1; }
          done
          node --check www/dynamic_rank.js
          echo "VERIFIED: current working main engine + history + service worker + English display layer"

      - name: Create Capacitor project
