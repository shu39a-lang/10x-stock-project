workflows:
  ios-workflow:
    name: 10X STOCK ZERO English iOS
    max_build_duration: 60

    integrations:
      app_store_connect: codemagic7

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.shu39a.tenxstockenglish
      xcode: latest
      node: latest

    scripts:
      - name: Prepare complete English web app
        script: |
          set -e

          # Keep the English patch that currently exists on english-version.
          cp -f index.html /tmp/english_patch.html

          # Get the complete, working app source from main.
          git fetch origin main
          git show origin/main:index.html > /tmp/main_index.html
          git show origin/main:dynamic_rank.js > /tmp/main_dynamic_rank.js
          git show origin/main:quick_buy_check.js > /tmp/main_quick_buy_check.js
          git show origin/main:auto_score.js > /tmp/main_auto_score.js
          git show origin/main:stock_lookup_fix.js > /tmp/main_stock_lookup_fix.js

          # Build a complete index.html by inserting the existing English patch
          # immediately before </body> of the working main app.
          python3 - <<'PY'
          from pathlib import Path

          main = Path("/tmp/main_index.html").read_text(encoding="utf-8")
          patch = Path("/tmp/english_patch.html").read_text(encoding="utf-8")

          main = main.replace('<html lang="ja">', '<html lang="en">', 1)
          main = main.replace(
              '"https://shu39a-lang.github.io/10x-stock-project/"',
              '"https://raw.githubusercontent.com/shu39a-lang/10x-stock-project/english-version/"'
          )
          main = main.replace("https://jp.tradingview.com/", "https://www.tradingview.com/")

          if "</body>" not in main:
              raise SystemExit("main index.html is incomplete")

          complete = main.replace("</body>", patch + "\n</body>", 1)
          Path("index.html").write_text(complete, encoding="utf-8")
          PY

          # Keep the proven working JS logic from main for this recovery build.
          cp -f /tmp/main_dynamic_rank.js dynamic_rank.js
          cp -f /tmp/main_quick_buy_check.js quick_buy_check.js
          cp -f /tmp/main_auto_score.js auto_score.js
          cp -f /tmp/main_stock_lookup_fix.js stock_lookup_fix.js

          # Basic completeness checks.
          test -s index.html
          grep -q '<!doctype html>' index.html
          grep -q '10X STOCK ZERO' index.html
          grep -q 'dynamic_rank.js' index.html
          grep -q 'quick_buy_check.js' index.html

          rm -rf www
          mkdir -p www
          cp -f index.html www/index.html
          cp -f *.html www/ 2>/dev/null || true
          cp -f *.json www/ 2>/dev/null || true
          cp -f *.js www/ 2>/dev/null || true
          cp -f *.webmanifest www/ 2>/dev/null || true
          cp -f *.png www/ 2>/dev/null || true

      - name: Create Capacitor project
        script: |
          set -e
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          npx cap init "10X STOCK ZERO" "com.shu39a.tenxstockenglish" --web-dir=www --skip-appid-validation
          npx cap add ios
          printf '{"plugins":{"CapacitorHttp":{"enabled":true}}}' > capacitor.config.json
          npx cap sync ios

      - name: Install finalized app icon
        script: |
          set -e
          ICONSET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          cp -f 10X_STOCK_ZERO_AppIcon_1024.png "$ICONSET/AppIcon-512@2x.png"
          cat > "$ICONSET/Contents.json" <<'EOF'
          {
            "images" : [
              {
                "filename" : "AppIcon-512@2x.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          EOF

      - name: Set up code signing
        script: |
          cd ios/App
          xcode-project use-profiles

      - name: Set build number
        script: |
          cd ios/App
          agvtool new-marketing-version 1.0
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Build IPA
        script: |
          cd ios/App
          xcode-project build-ipa \
            --project "App.xcodeproj" \
            --scheme "App"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
