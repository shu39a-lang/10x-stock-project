workflows:
  ios-workflow:
    name: 10X STOCK ZERO English iOS
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic7
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.shu39a.tenxstockenglish
      xcode: latest
      node: latest
    scripts:
      - name: Copy the known-working Japanese app
        script: |
          set -e
          rm -rf www main_source
          mkdir -p www main_source
          BASE="https://raw.githubusercontent.com/shu39a-lang/10x-stock-project/main"
          for f in index.html dynamic_rank.js quick_buy_check.js auto_score.js stock_lookup_fix.js tenx_data.json tenx_history.json live_quotes.json manifest.webmanifest sw.js privacy.html terms.html support.html; do
            curl -fL "$BASE/$f" -o "main_source/$f" || true
            cp -f "main_source/$f" "www/$f" 2>/dev/null || true
          done
          cp -f *.png www/ 2>/dev/null || true
          test -s www/index.html
          test -s www/dynamic_rank.js
          grep -q 'function renderRanking' www/index.html
          grep -q 'calcScore();renderRanking();' www/index.html
          grep -q 'const DATA=' www/index.html
          grep -q 'function grade' www/index.html

      - name: Add English display without replacing app logic
        script: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p=Path("www/index.html")
          s=p.read_text(encoding="utf-8")
          s=s.replace('<html lang="ja">','<html lang="en">',1)

          # Build English display names for all ranked stocks without touching
          # ranking/search/scoring engines.
          import json, re, subprocess, sys
          try:
              import yfinance as yf
          except Exception:
              subprocess.check_call([sys.executable,"-m","pip","install","-q","yfinance"])
              import yfinance as yf

          data=json.loads(Path("www/tenx_data.json").read_text(encoding="utf-8"))
          company_map={}
          code_map={}
          seen=set()
          for market in ("japan","usa"):
              group=data.get(market) or {}
              for key,val in group.items():
                  if not isinstance(val,list):
                      continue
                  for row in val:
                      code=str(row.get("code") or "").strip().upper().replace(".T","")
                      jp=str(row.get("name") or "").strip()
                      if not code or (market,code) in seen:
                          continue
                      seen.add((market,code))
                      symbol=code+".T" if market=="japan" else code
                      en=""
                      try:
                          info=yf.Ticker(symbol).info or {}
                          for k in ("longName","shortName","displayName"):
                              cand=str(info.get(k) or "").strip()
                              if re.search(r"[A-Za-z]",cand):
                                  en=cand
                                  break
                      except Exception:
                          pass
                      if not en:
                          en=code
                      code_map[code]=en
                      if jp:
                          company_map[jp]=en

          # High-confidence fallbacks for names seen in the current app.
          fallback={
            "ヌー・ホールディングス":"Nu Holdings",
            "デル・テクノロジーズ":"Dell Technologies",
            "シェブロン":"Chevron",
            "台湾積体電路製造":"Taiwan Semiconductor Manufacturing",
            "マイクロン・テクノロジー":"Micron Technology",
            "アルファベット":"Alphabet",
            "エクソンモービル":"Exxon Mobil",
            "ハスキー・エナジー":"Cenovus Energy",
            "ペトロブラス":"Petrobras",
            "オキシデンタル・ペトロリアム":"Occidental Petroleum",
            "古河電気工業":"Furukawa Electric",
            "ソフトバンクグループ":"SoftBank Group",
            "ファナック":"FANUC",
            "トヨタ自動車":"Toyota Motor",
            "アドバンテスト":"Advantest",
            "東京エレクトロン":"Tokyo Electron",
            "三菱重工業":"Mitsubishi Heavy Industries",
            "フジクラ":"Fujikura",
            "日立製作所":"Hitachi",
            "三菱UFJフィナンシャル・グループ":"Mitsubishi UFJ Financial Group",
            "信越化学工業":"Shin-Etsu Chemical",
            "ダイキン工業":"Daikin Industries",
            "三菱商事":"Mitsubishi Corporation",
            "東京海上HD":"Tokio Marine Holdings",
            "ソニーグループ":"Sony Group",
            "日本電信電話":"NTT",
            "任天堂":"Nintendo",
            "キーエンス":"Keyence",
            "リクルートHD":"Recruit Holdings"
          }
          company_map.update(fallback)

          # Convert all user-facing market links from Japanese destinations to English destinations.
          url_map={
            "https://finance.yahoo.co.jp/stocks/ranking/up?market=all":"https://www.tradingview.com/markets/stocks-japan/market-movers-gainers/",
            "https://finance.yahoo.co.jp/stocks/us/ranking/up":"https://www.tradingview.com/markets/stocks-usa/market-movers-gainers/",
            "https://finance.yahoo.co.jp/stocks/ranking/down?market=all":"https://www.tradingview.com/markets/stocks-japan/market-movers-losers/",
            "https://finance.yahoo.co.jp/stocks/us/ranking/down":"https://www.tradingview.com/markets/stocks-usa/market-movers-losers/",
            "https://finance.yahoo.co.jp/stocks/ranking/volume?market=all&term=daily":"https://www.tradingview.com/markets/stocks-japan/market-movers-active/",
            "https://finance.yahoo.co.jp/stocks/us/ranking/volume":"https://www.tradingview.com/markets/stocks-usa/market-movers-active/",
            "https://jp.tradingview.com/":"https://www.tradingview.com/"
          }
          for old,new in url_map.items(): s=s.replace(old,new)

          old_stock='function stockUrl(m,c){return m==="japan"?"https://finance.yahoo.co.jp/quote/"+encodeURIComponent(c)+".T":"https://finance.yahoo.co.jp/quote/"+encodeURIComponent(c)}'
          new_stock='function stockUrl(m,c){return m==="japan"?"https://www.tradingview.com/symbols/TSE-"+encodeURIComponent(c)+"/":"https://www.tradingview.com/symbols/"+encodeURIComponent(c)+"/"}'
          if old_stock not in s: raise SystemExit("STOP: stockUrl changed on main")
          s=s.replace(old_stock,new_stock,1)

          company_json=json.dumps(company_map,ensure_ascii=False)
          code_json=json.dumps(code_map,ensure_ascii=False)
          layer = r"""
          <style id="ENGLISH_IPHONE_LAYOUT">
          html,body{width:100%!important;max-width:100%!important;overflow-x:hidden!important}
          .app{width:100%!important;max-width:820px!important;overflow-x:hidden!important}
          .app *{min-width:0}
          #topRankingSection>div[style*="white-space:nowrap"]{white-space:normal!important;font-size:9px!important;line-height:1.4!important}
          @media(max-width:520px){
            .rankhead h2{font-size:16px!important;line-height:1.15!important}
            .trow{grid-template-columns:28px 48px minmax(0,1fr) 42px 30px 26px!important;gap:3px!important;font-size:10px!important}
            #marketInfoLinks>div[style*="grid-template-columns:repeat(4,1fr)"]{grid-template-columns:repeat(2,minmax(0,1fr))!important}
            #marketInfoLinks [style*="white-space:nowrap"]{white-space:normal!important}
            .navbtn{font-size:7px!important}
          }
          </style>
          <script id="ENGLISH_DISPLAY_ONLY">
          (() => {
            const map = new Map([
              ["使い方ガイド","User Guide"],["株式分析ツール","Stock Analysis Tool"],
              ["日本株","Japan Stocks"],["米国株","U.S. Stocks"],
              ["短期","Short Term"],["中期","Mid Term"],["長期","Long Term"],
              ["〜6か月","Up to 6 months"],["6か月〜1年","6–12 months"],["1年以上","1+ year"],
              ["全て見る 〉","View All 〉"],["11〜20位を見る","View 11–20"],["TOP10に戻る","Back to TOP10"],
              ["順位","Rank"],["コード","Ticker"],["銘柄名","Company"],["スコア","Score"],["格付","Grade"],
              ["ホーム","Home"],["分析結果","Analysis"],["保有株","Portfolio"],["お気に入り","Favorites"],["設定・その他","Settings & More"],
              ["銘柄を確認・入力して分析","Enter a Stock to Analyze"],
              ["新規銘柄・保有株を5項目で分析","Analyze stocks using 5 factors"],
              ["📊 データ・ランキング","📊 Data & Rankings"],["値上がり","Top Gainers"],["値下がり","Top Losers"],
              ["出来高","Volume"],["急増","Surge"],["決算カレンダー","Earnings Calendar"],
              ["52週高値","52-Week High"],["セクター動向","Sector Trends"],["スクリーナー","Screener"],
              ["📋 分析・検索","📋 Analysis & Search"],["個別銘柄検索","Stock Search"],["分析履歴","Analysis History"],
              ["Top Gainersランキング","Top Gainers"],["Top Losersランキング","Top Losers"],["Volumeランキング","Volume Ranking"],
              ["Portfolio管理","Portfolio"],["保有株管理","Portfolio"],["登録銘柄一覧","Saved Stocks"],
              ["保有銘柄の管理","Manage Holdings"],["各種設定","App Settings"],["設定","Settings"],
              ["情報確認","View Info"],["削除","Delete"],["現在値を反映","Apply Current Price"],
              ["分析を編集","Edit Analysis"],["別分析として開く","Open as New Analysis"],
              ...Object.entries(__COMPANY_MAP__)
            ]);
            const phrase = [
              ["◎ 選択中：","◎ Selected: "],
              ["🏆 日本株・短期 TOP10","🏆 Japan Stocks • Short Term TOP10"],
              ["🟥 赤：上昇期待　　🟦 青：安定上昇　　🟨 黄：成長株","🟥 Red: Upside Potential   🟦 Blue: Steady Growth   🟨 Yellow: Growth Stock"],
              ["🕒 TOP10 データ更新時間（日本時間）","🕒 TOP10 Data Update Time (JST)"],
              ["06:30頃","Around 06:30"],["16:00頃","Around 16:00"],
              ["（アメリカ株）","(U.S. Stocks)"],["（日本株）","(Japan Stocks)"],
              ["Top Gainersランキング","Top Gainers"],["Top Losersランキング","Top Losers"],["Volumeランキング","Volume Ranking"],
              ["分析履歴","Analysis History"],["Portfolio管理","Portfolio"],["設定","Settings"],
              ["外部サイトで情報を確認し、5項目を0〜100で評価すると自動でOverall Scoreを計算します。","Review stock information and rate the five factors from 0 to 100. The Overall Score is calculated automatically."]
            ];
            function translate(raw){
              let lead=(raw.match(/^\s*/)||[""])[0], tail=(raw.match(/\s*$/)||[""])[0], x=raw.trim();
              if(!x)return raw;
              if(map.has(x))x=map.get(x);
              for(const [a,b] of phrase)x=x.split(a).join(b);
              x=x.replace(/日本株/g,"Japan Stocks").replace(/米国株/g,"U.S. Stocks")
                 .replace(/短期/g,"Short Term").replace(/中期/g,"Mid Term").replace(/長期/g,"Long Term")
                 .replace(/上昇期待/g,"Upside Potential").replace(/安定上昇/g,"Steady Growth").replace(/成長株/g,"Growth Stock");
              return lead+x+tail;
            }
            const englishByCode = __CODE_MAP__;
            function fixNameField(){
              const code=(document.querySelector("#codeInput")?.value||"").trim().toUpperCase().replace(/\.T$/,"");
              const name=document.querySelector("#nameInput");
              if(name && code && englishByCode[code]) name.value=englishByCode[code];
            }
            function walk(root=document.body){
              const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
              let n; while(n=w.nextNode()){
                if(/[\u3040-\u30ff\u3400-\u9fff]/.test(n.nodeValue)) n.nodeValue=translate(n.nodeValue);
              }
              root.querySelectorAll?.("[placeholder]").forEach(e=>e.placeholder=translate(e.placeholder));
              fixNameField();
            }
            document.addEventListener("DOMContentLoaded",()=>{walk();setTimeout(()=>walk(),300);setTimeout(()=>walk(),1500)});
            new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{
              if(n.nodeType===1)walk(n);
              else if(n.nodeType===3 && /[\u3040-\u30ff\u3400-\u9fff]/.test(n.nodeValue))n.nodeValue=translate(n.nodeValue);
            }))).observe(document.documentElement,{childList:true,subtree:true});
          })();
          </script>
          """
          layer=layer.replace("__COMPANY_MAP__",company_json)
          layer=layer.replace("__CODE_MAP__",code_json)
          s=s.replace("</head>",layer+"\n</head>",1)

          about_map={
            "10X STOCK ZEROは、日本株・米国株の市場データから多数の銘柄をスクリーニングし、流動性を考慮したうえで、複数の指標を組み合わせて総合評価しています。":
              "10X STOCK ZERO screens a large number of Japan and U.S. stocks, considers liquidity, and combines multiple indicators for an overall assessment.",
            "テクニカル分析では、20日・50日・200日移動平均、RSI、MACD、出来高、株価モメンタムなどを使用しています。財務・企業分析では、PER、PBR、PSR、売上成長、利益成長、ROE、利益率、キャッシュフロー、負債水準などを参考にしています。":
              "Technical analysis uses 20-day, 50-day, and 200-day moving averages, RSI, MACD, volume, and price momentum. Financial and company analysis considers PER, PBR, PSR, revenue growth, profit growth, ROE, profit margin, cash flow, and debt levels.",
            "短期・中期・長期ではそれぞれ異なる条件を適用し、各時間軸に適した銘柄を評価してTOP10を選定しています。":
              "Different criteria are applied to Short Term, Mid Term, and Long Term, and TOP10 stocks are selected for each time horizon.",
            "※ スコアやランキングは将来の株価上昇や利益を保証するものではありません。市場環境や企業情報の変化により評価は変動します。最終的な投資判断は利用者ご自身で行ってください。":
              "Scores and rankings do not guarantee future price increases or profits. Ratings may change with market conditions and company information. Make final investment decisions based on your own judgment."
          }
          for a,b in about_map.items():
              s=s.replace(a,b)

          p.write_text(s,encoding="utf-8")
          PY

      - name: Verify working engine is still present
        script: |
          set -e
          grep -q '<html lang="en">' www/index.html
          grep -q 'function renderRanking' www/index.html
          grep -q 'calcScore();renderRanking();' www/index.html
          grep -q 'data-market="japan"' www/index.html
          grep -q 'data-market="usa"' www/index.html
          grep -q 'data-term="short"' www/index.html
          grep -q 'data-term="mid"' www/index.html
          grep -q 'data-term="long"' www/index.html
          grep -q 'ENGLISH_DISPLAY_ONLY' www/index.html
          grep -q 'https://www.tradingview.com/markets/stocks-japan/market-movers-gainers/' www/index.html
          grep -q 'https://www.tradingview.com/markets/stocks-usa/market-movers-gainers/' www/index.html
          grep -q 'https://www.tradingview.com/symbols/TSE-' www/index.html
          if grep -q 'https://jp.tradingview.com/' www/index.html; then echo "Japanese TradingView URL remains"; exit 1; fi
          if grep -q 'https://finance.yahoo.co.jp/' www/index.html; then echo "Japanese Yahoo Finance URL remains"; exit 1; fi
          test -s www/tenx_history.json
          test -s www/sw.js
          grep -q 'function renderRanking' www/index.html
          grep -q 'calcScore();renderRanking();' www/index.html
          # HARD CHECK: never alter the successful Japanese ranking/scoring/search engines.
          for f in dynamic_rank.js quick_buy_check.js auto_score.js stock_lookup_fix.js; do
            test -s "main_source/$f"
            test -s "www/$f"
            cmp -s "main_source/$f" "www/$f" || { echo "STOP: $f differs from successful Japanese main"; exit 1; }
          done
          node --check www/dynamic_rank.js
          echo "VERIFIED: current working main engine + history + service worker + English display layer"

      - name: Create Capacitor project
        script: |
          set -e
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          npx cap init "10X STOCK ZERO" "com.shu39a.tenxstockenglish" --web-dir=www --skip-appid-validation
          npx cap add ios
          printf '{"plugins":{"CapacitorHttp":{"enabled":true}}}' > capacitor.config.json
          npx cap sync ios

      - name: Install app icon
        script: |
          set -e
          ICONSET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          cp -f 10X_STOCK_ZERO_AppIcon_1024.png "$ICONSET/AppIcon-512@2x.png"
          cat > "$ICONSET/Contents.json" <<'EOF'
          {"images":[{"filename":"AppIcon-512@2x.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}
          EOF

      - name: Set up code signing
        script: |
          cd ios/App
          xcode-project use-profiles

      - name: Set build number
        script: |
          cd ios/App
          agvtool new-marketing-version 1.0
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Build IPA
        script: |
          cd ios/App
          xcode-project build-ipa --project "App.xcodeproj" --scheme "App"
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
