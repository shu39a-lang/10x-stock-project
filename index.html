<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>元金10倍計画</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050910;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
.app{max-width:760px;margin:auto;padding:16px 12px 40px}.gold{color:#ffd54f;font-weight:900;letter-spacing:.06em}h1{font-size:38px;margin:4px 0 8px}
.sub{color:#aab5c3;font-size:13px}.status{margin:14px 0;padding:12px;border:1px solid #263448;border-radius:14px;background:#0a121c;display:flex;justify-content:space-between;gap:10px}.auto{color:#75ec9c;font-weight:900}
.sticky{position:sticky;top:0;z-index:10;background:rgba(5,9,16,.96);padding:8px 0}.markets,.hz{display:grid;gap:8px}.markets{grid-template-columns:1fr 1fr}.hz{grid-template-columns:repeat(3,1fr);margin-top:9px}
button{font-family:inherit}.market{height:60px;border:0;border-radius:15px;font-size:22px;font-weight:900}.jp{background:#fff;color:#c20e2d}.us{background:#28479d;color:#fff}
.h{height:70px;border-radius:14px;border:1px solid #2a394b;background:#101923;color:#fff}.h b{display:block;font-size:19px}.h small{display:block;color:#98a5b5;margin-top:5px}
.active{outline:3px solid #ffd54f;outline-offset:1px}.title{font-size:26px;font-weight:900;margin:20px 2px 10px}.list{display:grid;gap:10px}
.stock{background:#0b141e;border:1px solid #29384b;border-radius:16px;padding:13px}.r1{display:grid;grid-template-columns:42px 1fr 42px;gap:10px;align-items:center}
.rank{width:40px;height:40px;border-radius:50%;background:#182433;display:grid;place-items:center;font-size:18px;font-weight:900}.stock:nth-child(1) .rank{background:#f5c928;color:#111}.stock:nth-child(2) .rank{background:#d8dde5;color:#111}.stock:nth-child(3) .rank{background:#d98933;color:#111}
.name{font-size:20px;font-weight:900}.code{color:#96a3b3;font-size:12px;margin-top:3px}.chart{width:42px;height:42px;border-radius:9px;border:1px solid #2b425a;background:#101a25;display:grid;place-items:center;text-decoration:none;font-size:22px}
.r2{display:grid;grid-template-columns:1.1fr 1fr 1fr auto;gap:8px;border-top:1px solid #223142;margin-top:11px;padding-top:10px;align-items:end}.m label{display:block;color:#8492a4;font-size:10px;margin-bottom:3px}.m strong{font-size:16px}
.up{color:#42df7d}.down{color:#ff626c}.sig{padding:7px 9px;border-radius:8px;font-size:13px;font-weight:900;white-space:nowrap}.best{color:#ff646c;border:1px solid #c6373e}.good{color:#ffb33a;border:1px solid #96610c}.watch{color:#91f177;border:1px solid #4c9b35}
.sim{margin-top:22px;border:1px solid #29384b;border-radius:16px;overflow:hidden;background:#09121b}.simh{padding:14px;background:#101a26}.simh h2{font-size:21px;margin:0}.simh div{font-size:11px;color:#98a6b6;margin-top:4px}
.srow{padding:12px;border-top:1px solid #1f2d3d}.sname{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:900}.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.sc{background:#0f1924;border:1px solid #1f3043;border-radius:8px;padding:7px}.sc label{display:block;color:#7f8ea0;font-size:9px}.sc strong{font-size:12px}
.total{margin:12px;padding:12px;border:1px solid #29435f;border-radius:11px;background:#111e2b;display:grid;grid-template-columns:1fr 1fr;gap:8px}.total span{font-size:11px;color:#9facbc}.total b{display:block;margin-top:3px;font-size:15px}
.note{text-align:center;color:#6f7d8d;font-size:10px;line-height:1.6;margin:18px 5px}.empty{text-align:center;padding:24px;color:#788596}
@media(min-width:700px){.list{grid-template-columns:1fr 1fr}}
</style></head><body><div class="app">
<div class="gold">10X STOCK PROJECT</div><h1>元金10倍計画</h1><div class="sub">成長性・テクニカル・出来高などを総合評価して候補を抽出</div>
<div class="status"><div id="updated">最終更新：読込中…</div><div class="auto">自動更新</div></div>
<div class="sticky"><div class="markets"><button id="jp" class="market jp active">🇯🇵 日本株</button><button id="us" class="market us">🇺🇸 米国株</button></div>
<div class="hz"><button class="h active" data-h="short"><b>短期</b><small>〜6か月</small></button><button class="h" data-h="medium"><b>中期</b><small>6か月〜1年</small></button><button class="h" data-h="long"><b>長期</b><small>1年以上</small></button></div></div>
<div id="title" class="title">日本株・短期 TOP10</div><div id="list" class="list"></div>
<div class="sim"><div class="simh"><h2>100株 仮想購入シミュレーション</h2><div id="simtitle"></div></div><div id="simrows"></div><div id="total" class="total"></div></div>
<div class="note">※候補抽出・検証用の参考情報です。利益や元金10倍を保証するものではありません。投資判断はご自身の責任で行ってください。</div>
</div>
<script>
let market="japan",horizon="short",D={japan:{short:[],medium:[],long:[]},usa:{short:[],medium:[],long:[]}},H=[];
const $=s=>document.querySelector(s),L={short:"短期",medium:"中期",long:"長期"};
const money=(x,m=market)=>m==="japan"?"¥"+Number(x).toLocaleString(undefined,{maximumFractionDigits:2}):"$"+Number(x).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const chart=x=>"https://www.tradingview.com/chart/?symbol="+encodeURIComponent(market==="japan"?"TSE:"+x.code:x.code);
const sig=s=>s==="最有力"?"best":s==="有力"?"good":"watch";
function firstBuy(code){const a=H.filter(x=>x.market===market&&x.horizon===horizon&&x.code===code).sort((a,b)=>String(a.date).localeCompare(String(b.date)));return a.length?Number(a[0].buy_price):null}
function entryPrice(x){const h=firstBuy(x.code);if(h!==null&&Number.isFinite(h)&&h>0)return h;const n=Number(x.price),c=Number(x.change_pct);if(Number.isFinite(n)&&Number.isFinite(c)&&1+c/100>0)return n/(1+c/100);return n}
function render(){
 const a=(D[market]?.[horizon]||[]).slice(0,10),mname=market==="japan"?"日本株":"米国株";
 $("#title").textContent=mname+"・"+L[horizon]+" TOP10";$("#simtitle").textContent=mname+"・"+L[horizon]+" TOP10（各100株）";
 $("#list").innerHTML=a.length?a.map((x,i)=>`<div class="stock"><div class="r1"><div class="rank">${i+1}</div><div><div class="name">${x.name}</div><div class="code">${x.code}</div></div><a class="chart" href="${chart(x)}" target="_blank">📈</a></div><div class="r2"><div class="m"><label>現在値</label><strong>${money(x.price)}</strong></div><div class="m"><label>騰落率</label><strong class="${x.change_pct>=0?"up":"down"}">${x.change_pct>0?"+":""}${x.change_pct}%</strong></div><div class="m"><label>総合スコア</label><strong>${x.score}</strong></div><span class="sig ${sig(x.signal)}">${x.signal}</span></div></div>`).join(""):'<div class="empty">データ更新後に表示します。</div>';
 let tb=0,tn=0;
 $("#simrows").innerHTML=a.length?a.map((x,i)=>{const b=entryPrice(x),n=Number(x.price),bv=b*100,nv=n*100,pl=nv-bv,p=b?(n/b-1)*100:0;tb+=bv;tn+=nv;return `<div class="srow"><div class="sname"><span>${i+1}. ${x.name}（${x.code}）</span><span class="${pl>=0?"up":"down"}">${pl>=0?"+":""}${p.toFixed(2)}%</span></div><div class="sg"><div class="sc"><label>購入額（100株）</label><strong>${money(bv)}</strong></div><div class="sc"><label>現在価値（100株）</label><strong>${money(nv)}</strong></div><div class="sc"><label>評価損益</label><strong class="${pl>=0?"up":"down"}">${pl>=0?"+":""}${money(pl)}</strong></div></div></div>`}).join(""):'<div class="empty">仮想購入データがありません。</div>';
 const pl=tn-tb,pct=tb?(tn/tb-1)*100:0;$("#total").innerHTML=`<span>合計購入額<b>${money(tb)}</b></span><span>現在評価額<b>${money(tn)}</b></span><span>合計損益<b class="${pl>=0?"up":"down"}">${pl>=0?"+":""}${money(pl)}</b></span><span>損益率<b class="${pl>=0?"up":"down"}">${pl>=0?"+":""}${pct.toFixed(2)}%</b></span>`;
}
$("#jp").onclick=()=>{market="japan";$("#jp").classList.add("active");$("#us").classList.remove("active");render()};$("#us").onclick=()=>{market="usa";$("#us").classList.add("active");$("#jp").classList.remove("active");render()};
document.querySelectorAll(".h").forEach(b=>b.onclick=()=>{horizon=b.dataset.h;document.querySelectorAll(".h").forEach(x=>x.classList.toggle("active",x===b));render()});
Promise.all([fetch("tenx_data.json?"+Date.now()).then(r=>r.json()),fetch("tenx_history.json?"+Date.now()).then(r=>r.json())]).then(([d,h])=>{D=d;H=Array.isArray(h)?h:[];$("#updated").textContent="最終更新："+d.updated_at;render()}).catch(()=>{$("#updated").textContent="データ読込エラー"});render();
</script></body></html>
