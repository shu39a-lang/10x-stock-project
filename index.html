    ["買いタイミング診断","Buy Timing Analysis"],["気になる銘柄コードを入力して、現在の買い条件を確認","Enter a ticker to check current buy conditions"],
    ["診断する","Analyze"],["現在の分析データを使って判定します。","Uses the current analysis data."],
    ["🟥 赤：上昇期待","🟥 Upside"],["🟦 青：安定上昇","🟦 Steady"],["🟨 黄：成長株","🟨 Growth"],

    ["現在値を取得できませんでした。もう一度コード欄から移動してください。","Current price could not be retrieved. Leave the ticker field and try again."],

  const guide = [
    ["1. 市場と期間を選ぶ","1. Select a Market and Term"],
    ["2. TOP10ランキングを見る","2. View the TOP10"],
    ["3. TOP10の更新時間","3. Check Update Times"],

    ["7. データ・ランキングのリンク","7. Data & Ranking Links"],
    ["8. 注目・急増・高値のリンク","8. Watch, Surge & High Links"],
    ["9. お気に入りと保有株管理","9. Favorites & Portfolio"],
    ["10. 設定・バックアップ","10. Settings & Backup"],
    ["重要な注意事項","Important Notice"],
    ["・米国株：午前6時30分頃","• U.S. Stocks: Around 06:30"],
    ["・日本株：午後4時頃","• Japan Stocks: Around 16:00"],
    ["・短期：6か月以内","• Short Term: Up to 6 months"],
    ["・中期：6か月〜1年","• Mid Term: 6–12 months"],
    ["・長期：1年以上","• Long Term: 1+ year"],
    ["・赤：上昇期待","• Red: Upside Potential"],["・青：安定上昇","• Blue: Steady Growth"],["・黄：成長株","• Yellow: Growth Stock"]
  ];

  const all = [...phrases, ...guide].sort((a,b)=>b[0].length-a[0].length);

  function translateText(text) {
    let t = text;
    if (exact.has(t.trim())) {
      const lead=t.match(/^\s*/)[0], tail=t.match(/\s*$/)[0];
      return lead + exact.get(t.trim()) + tail;
    }
    for (const [jp,en] of all) t=t.split(jp).join(en);
    return t;
  }

  function translate(root=document.body) {
    const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
    const nodes=[]; while(w.nextNode()) nodes.push(w.currentNode);
    for(const n of nodes){
      const p=n.parentElement;
      if(!p || /^(SCRIPT|STYLE|TEXTAREA|OPTION)$/.test(p.tagName)) continue;
      const v=translateText(n.nodeValue);
      if(v!==n.nodeValue) n.nodeValue=v;
    }
    document.documentElement.lang="en";
  }

  translate();
  new MutationObserver(ms=>{
    for(const m of ms) for(const n of m.addedNodes){
      if(n.nodeType===1) translate(n);
      else if(n.nodeType===3 && n.parentElement && !/^(SCRIPT|STYLE|TEXTAREA|OPTION)$/.test(n.parentElement.tagName)){
        const v=translateText(n.nodeValue); if(v!==n.nodeValue)n.nodeValue=v;
      }
    }
  }).observe(document.body,{childList:true,subtree:true});
})();
</script>
