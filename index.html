<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>元金10倍計画｜10X Stock Project</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Kaku Gothic ProN",Meiryo,sans-serif}
.app{width:100%;max-width:640px;margin:auto;padding:10px}.hero{padding:10px 4px 8px}.k{font-size:12px;color:#ffd54f;font-weight:800}.hero h1{font-size:28px;margin:3px 0}.sub{font-size:12px;color:#888}
.progress{background:#0c0c0c;border:1px solid #262626;border-radius:15px;padding:12px;margin:8px 0 12px}.pbig{font-size:22px;font-weight:900;margin:5px 0}.bar{height:9px;background:#222;border-radius:9px;overflow:hidden}.bar div{height:100%;width:2%;background:linear-gradient(90deg,#ffd54f,#ff9800)}
.tabs,.hz{display:grid;gap:8px;position:sticky;background:#000;z-index:10;padding:5px 0}.tabs{grid-template-columns:1fr 1fr;top:0}.hz{grid-template-columns:repeat(3,1fr);top:64px}
button{border-radius:12px;font-weight:900}.tab{height:52px;font-size:18px}.jp{background:#fff;color:#bc002d;border:2px solid #bc002d}.us{background:#3c3b6e;color:#fff;border:2px solid #b22234}.h{height:43px;background:#171717;color:#aaa;border:1px solid #333}.active{outline:3px solid #ffd54f}
.title{font-size:21px;font-weight:900;margin:12px 2px 3px}.meta,.note{font-size:11px;color:#888;margin:0 2px 10px}
.list{display:grid;gap:9px}.card{background:#0b0b0b;border:1px solid #292929;border-radius:14px;padding:12px;display:grid;grid-template-columns:40px 1fr auto;gap:8px;align-items:center}
.rank{width:36px;height:36px;border-radius:50%;background:#222;display:grid;place-items:center;font-weight:900}.name{font-size:17px;font-weight:900}.code{font-size:11px;color:#888}.price{text-align:right;font-weight:900}.up{color:#45d483}.down{color:#ff6b6b}
.score{grid-column:2/4;border-top:1px solid #222;padding-top:7px;display:flex;justify-content:space-between;font-size:12px}.signal{color:#ffd54f;font-weight:900}
.metrics{grid-column:2/4;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;font-size:10px;color:#888}.metrics span{background:#151515;padding:4px;border-radius:6px;text-align:center}
.history{margin-top:22px;border-top:1px solid #222;padding-top:14px}.hlist{height:390px;overflow-y:auto;border:1px solid #222;border-radius:14px;background:#080808}.empty{text-align:center;color:#777;padding:28px 10px}.footer{font-size:10px;color:#666;text-align:center;margin:15px 6px;line-height:1.5}
</style></head><body><div class="app">
<div class="hero"><div class="k">10X STOCK PROJECT</div><h1>元金10倍計画</h1><div class="sub">短期・中期・長期を分けて、実績で育てる株式スクリーナー</div></div>
<div class="progress"><div class="meta">10倍達成率 <span style="float:right">0.0%</span></div><div class="pbig">¥1,000,000 → 目標 ¥10,000,000</div><div class="bar"><div></div></div></div>
<div class="tabs"><button id="jp" class="tab jp active">🇯🇵 日本株</button><button id="us" class="tab us">🇺🇸 米国株</button></div>
<div class="hz"><button class="h active" data-h="short">短期<br><small>数日〜1か月</small></button><button class="h" data-h="medium">中期<br><small>1〜6か月</small></button><button class="h" data-h="long">長期<br><small>6か月〜数年</small></button></div>
<div class="title" id="title">日本株・短期 TOP5</div><div class="meta">公開準備完了｜自動更新設定は次の段階で接続します</div><div class="list" id="list"></div>
<section class="history"><div class="title" style="margin-top:0">100株 仮想購入の成績</div><div class="note">初回選出日の終値で100株購入したと仮定。各区分50件まで保存します。</div><div class="hlist"><div class="empty">運用開始後、ここに成績が自動蓄積されます。</div></div></section>
<div class="footer">候補抽出と検証を目的としたシミュレーションです。将来の利益や10倍達成を保証するものではありません。</div>
</div><script>
let market="japan",horizon="short";const $=s=>document.querySelector(s);
const sample={japan:{short:[
{name:"アドバンテスト",code:"6857",price:36870,change_pct:2.59,score:82.4,signal:"最有力",trend:92,momentum:84,macd:88,volume_score:76,relative:86,risk:72},
{name:"任天堂",code:"7974",price:8900,change_pct:6.91,score:79.1,signal:"有力",trend:88,momentum:81,macd:83,volume_score:74,relative:79,risk:65},
{name:"NEC",code:"6701",price:5168,change_pct:5.10,score:77.8,signal:"有力",trend:90,momentum:78,macd:82,volume_score:70,relative:81,risk:68}],medium:[],long:[]},
usa:{short:[
{name:"NVIDIA",code:"NVDA",price:225.16,change_pct:-0.04,score:83.0,signal:"最有力",trend:95,momentum:80,macd:86,volume_score:78,relative:91,risk:74},
{name:"AMD",code:"AMD",price:514.39,change_pct:6.52,score:80.4,signal:"有力",trend:91,momentum:85,macd:89,volume_score:82,relative:87,risk:63}],medium:[],long:[]}};
function money(x){return market==="japan"?`¥${Number(x).toLocaleString("ja-JP",{maximumFractionDigits:1})}`:`$${Number(x).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}`}
function render(){let lab={short:"短期",medium:"中期",long:"長期"}[horizon],arr=sample[market][horizon]||[];$("#title").textContent=`${market==="japan"?"日本株":"米国株"}・${lab} TOP5`;$("#list").innerHTML=arr.length?arr.map((x,i)=>`<div class="card"><div class="rank">${i+1}</div><div><div class="name">${x.name}</div><div class="code">${x.code}</div></div><div class="price">${money(x.price)}<div class="${x.change_pct>=0?"up":"down"}" style="font-size:12px">${x.change_pct>0?"+":""}${x.change_pct.toFixed(2)}%</div></div><div class="score"><span>総合 ${x.score.toFixed(1)}</span><span class="signal">${x.signal}</span></div><div class="metrics"><span>トレンド ${x.trend}</span><span>勢い ${x.momentum}</span><span>MACD ${x.macd}</span><span>出来高 ${x.volume_score}</span><span>相対強度 ${x.relative}</span><span>リスク ${x.risk}</span></div></div>`).join(""):`<div class="empty">自動更新開始後に候補を表示します。</div>`}
$("#jp").onclick=()=>{market="japan";$("#jp").classList.add("active");$("#us").classList.remove("active");render()};$("#us").onclick=()=>{market="usa";$("#us").classList.add("active");$("#jp").classList.remove("active");render()};document.querySelectorAll(".h").forEach(b=>b.onclick=()=>{horizon=b.dataset.h;document.querySelectorAll(".h").forEach(x=>x.classList.toggle("active",x===b));render()});render();
</script></body></html>
