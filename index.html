<!-- ENGLISH_DIRECT_UI_FIX_START -->
<script>
(()=>{
"use strict";

/* Direct English UI fixes. No MutationObserver translation layer. */
const $=s=>document.querySelector(s);

const textById={
  lookupStatus:"Enter a ticker/code to look up the company name and current price."
};
for(const [id,value] of Object.entries(textById)){
  const el=document.getElementById(id);
  if(el)el.textContent=value;
}

/* English-only history/portfolio rendering labels */
const oldRenderPortfolio=window.renderPortfolio;
const oldRenderFavorites=window.renderFavorites;
const oldRenderHistory=window.renderHistory;

/* English external stock information */
window.stockUrl=function(m,c){
  const code=String(c||"").trim().toUpperCase().replace(/\.T$/i,"");
  return m==="japan"
    ?"https://www.tradingview.com/symbols/TSE-"+encodeURIComponent(code)+"/"
    :"https://www.tradingview.com/symbols/"+encodeURIComponent(code)+"/";
};

/* English direct company-name lookup for the custom-stock input */
async function yahooEnglishName(market,code){
  const symbol=market==="japan"?code+".T":code;
  const url="https://query2.finance.yahoo.com/v1/finance/search?q="+
    encodeURIComponent(symbol)+
    "&quotesCount=6&newsCount=0&lang=en-US&region=US&_="+Date.now();
  try{
    let data=null;
    const http=window.Capacitor?.Plugins?.CapacitorHttp;
    if(http?.get){
      const r=await http.get({url,headers:{
        "Accept":"application/json",
        "Accept-Language":"en-US,en;q=0.9"
      }});
      data=typeof r.data==="string"?JSON.parse(r.data):r.data;
    }else{
      const r=await fetch(url,{cache:"no-store",headers:{
        "Accept-Language":"en-US,en;q=0.9"
      }});
      if(!r.ok)throw new Error("HTTP "+r.status);
      data=await r.json();
    }
    const wanted=symbol.toUpperCase();
    const q=(data?.quotes||[]).find(x=>String(x?.symbol||"").toUpperCase()===wanted)
      ||(data?.quotes||[])[0];
    return String(q?.longname||q?.shortname||"").trim();
  }catch(e){return""}
}

const priorCustom=window.autofillCustomStock;
window.autofillCustomStock=async function(){
  const market=$("#customMarket")?.value||"japan";
  const codeEl=$("#customCode");
  const code=String(codeEl?.value||"").trim().toUpperCase().replace(/\.T$/i,"");
  const st=$("#customLookup");
  if(!code){
    if(st)st.textContent="Enter a ticker/code to look up the company name and current price.";
    return null;
  }
  if(codeEl)codeEl.value=code;
  if(st)st.textContent="Loading company name and current price…";

  let q=null;
  try{ if(typeof priorCustom==="function")q=await priorCustom(); }catch(e){}

  const enName=await yahooEnglishName(market,code);
  if(enName&&$("#customName")){
    $("#customName").value=enName;
    $("#customName").readOnly=true;
  }
  if(st){
    const p=Number($("#customNow")?.value);
    if(enName&&Number.isFinite(p)&&p>0){
      st.className="lookupstatus ok";
      st.textContent="✓ "+enName+" | Current Price "+
        (market==="japan"?"¥":"$")+p.toLocaleString("en-US",{
          minimumFractionDigits:market==="usa"?2:0,
          maximumFractionDigits:2
        });
    }else if(enName){
      st.className="lookupstatus warn";
      st.textContent="✓ "+enName+" confirmed. Enter the current price manually.";
    }else{
      st.className="lookupstatus warn";
      st.textContent="Stock information could not be retrieved.";
    }
  }
  return q;
};
})();
</script>
<!-- ENGLISH_DIRECT_UI_FIX_END -->
