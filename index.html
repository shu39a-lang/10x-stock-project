<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>元金10倍計画</title><style>*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:-apple-system,sans-serif}.app{max-width:720px;margin:auto;padding:12px}h1{margin:4px 0}.gold{color:#ffd54f;font-weight:900}.tabs,.hz{display:grid;gap:8px;position:sticky;background:#000;padding:6px 0}.tabs{grid-template-columns:1fr 1fr;top:0}.hz{grid-template-columns:repeat(3,1fr);top:58px}button{height:46px;border-radius:12px;font-weight:900}.jp{background:#fff;color:#bc002d}.us{background:#3c3b6e;color:#fff}.h{background:#171717;color:#aaa;border:1px solid #333}.active{outline:3px solid #ffd54f}.card{margin:9px 0;padding:12px;background:#0b0b0b;border:1px solid #292929;border-radius:14px;display:grid;grid-template-columns:40px 1fr auto;gap:8px}.rank{background:#222;border-radius:50%;width:36px;height:36px;display:grid;place-items:center;font-weight:900}.name{font-size:17px;font-weight:900}.muted{font-size:11px;color:#888}.price{text-align:right;font-weight:900}.up{color:#45d483}.down{color:#ff6b6b}.score,.metrics{grid-column:2/4}.score{border-top:1px solid #222;padding-top:7px;display:flex;justify-content:space-between;font-size:12px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;font-size:10px;color:#aaa}.metrics span{background:#151515;padding:5px;border-radius:6px;text-align:center}.empty{padding:25px;text-align:center;color:#777}.history{max-height:350px;overflow:auto;border:1px solid #222;border-radius:12px}.hist{padding:8px;border-bottom:1px solid #222;font-size:12px}.foot{font-size:10px;color:#666;text-align:center;margin:18px}</style></head><body><div class="app"><div class="gold">10X STOCK PROJECT</div><h1>元金10倍計画</h1><div class="muted">短期・中期・長期 × 日本株・米国株</div><div class="tabs"><button id="jp" class="jp active">🇯🇵 日本株</button><button id="us" class="us">🇺🇸 米国株</button></div><div class="hz"><button class="h active" data-h="short">短期</button><button class="h" data-h="medium">中期</button><button class="h" data-h="long">長期</button></div><h2 id="title"></h2><div id="updated" class="muted">読込中…</div><div id="list"></div><h2>100株 仮想購入記録</h2><div id="history" class="history"></div><div class="foot">候補抽出・検証用です。利益や元金10倍を保証するものではありません。</div></div><script>
let market="japan",horizon="short",D={japan:{short:[],medium:[],long:[]},usa:{short:[],medium:[],long:[]}},H=[];const $=s=>document.querySelector(s),L={short:"短期",medium:"中期",long:"長期"};
function money(x){return market==="japan"?"¥"+Number(x).toLocaleString():"$"+Number(x).toFixed(2)}
function render(){let a=D[market]?.[horizon]||[];$("#title").textContent=(market==="japan"?"日本株":"米国株")+"・"+L[horizon]+" TOP5";$("#list").innerHTML=a.length?a.map((x,i)=>`<div class="card"><div class="rank">${i+1}</div><div><div class="name">${x.name}</div><div class="muted">${x.code}</div></div><div class="price">${money(x.price)}<div class="${x.change_pct>=0?"up":"down"}">${x.change_pct>0?"+":""}${x.change_pct}%</div></div><div class="score"><b>総合 ${x.score}</b><span class="gold">${x.signal}</span></div><div class="metrics"><span>トレンド ${x.trend}</span><span>勢い ${x.momentum}</span><span>MACD ${x.macd}</span><span>出来高 ${x.volume_score}</span><span>相対強度 ${x.relative}</span><span>リスク ${x.risk}</span></div></div>`).join(""):`<div class="empty">初回自動更新後に表示します。</div>`;let h=H.filter(x=>x.market===market&&x.horizon===horizon).slice(-50).reverse();$("#history").innerHTML=h.length?h.map(x=>`<div class="hist">${x.date}　<b>${x.name}</b>（${x.code}）100株 @ ${money(x.buy_price)}</div>`).join(""):`<div class="empty">記録は自動で蓄積されます。</div>`}
$("#jp").onclick=()=>{market="japan";$("#jp").classList.add("active");$("#us").classList.remove("active");render()};$("#us").onclick=()=>{market="usa";$("#us").classList.add("active");$("#jp").classList.remove("active");render()};document.querySelectorAll(".h").forEach(b=>b.onclick=()=>{horizon=b.dataset.h;document.querySelectorAll(".h").forEach(x=>x.classList.toggle("active",x===b));render()});Promise.all([fetch("tenx_data.json?"+Date.now()).then(r=>r.json()),fetch("tenx_history.json?"+Date.now()).then(r=>r.json())]).then(([d,h])=>{D=d;H=h;$("#updated").textContent="最終更新："+d.updated_at;render()});render();</script></body></html>
